<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC400">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TuDomiYa">
<title>TuDomiYa · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --amarillo:#FFC400; --fondo:#FFF7ED; --borde:#FED7AA; --suave:#FFEDD5; --amarillo-suave:#FEF3C7;
  --nuevo:#FB923C; --accion:#EA580C; --naranja:#C2410C;
  --texto:#44403C; --texto-fuerte:#1C1917; --texto-suave:#57534E; --gris:#78716C; --gris-claro:#F5F5F4; --linea:#E7E5E4;
  --verde:#15803D; --verde-suave:#DCFCE7; --verde-texto:#166534;
  --azul:#2563EB; --azul-texto:#1D4ED8; --azul-suave:#DBEAFE; --azul-linea:#93C5FD;
  --morado:#7E22CE; --morado-fuerte:#6B21A8; --morado-suave:#F3E8FF;
  --rojo:#DC2626; --rojo-texto:#B91C1C; --rojo-suave:#FEE2E2;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E7E5E4;font-family:'Outfit',system-ui,-apple-system,sans-serif;color:var(--texto);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
.app{max-width:430px;margin:0 auto;background:var(--fondo);min-height:100vh;min-height:100dvh}
.pantalla{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.contenido{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
.grow{flex:1}
.centro{text-align:center}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Encabezados */
.header{background:var(--amarillo);padding:calc(16px + env(safe-area-inset-top)) 20px 22px;border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:16px}
.header-fila{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca-wrap{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--naranja);color:var(--amarillo);display:flex;align-items:center;justify-content:center;border:none;padding:0;flex-shrink:0;cursor:pointer}
.marca{font-weight:800;font-size:26px;letter-spacing:-.5px;color:var(--naranja)}
.icon-btn{width:48px;height:48px;border-radius:16px;border:none;background:var(--naranja);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex-shrink:0}
.saludo-fila{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.saludo-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.saludo{font-size:32px;font-weight:800;letter-spacing:-.5px;line-height:1.1;color:var(--texto-fuerte)}
.estado{font-size:16px;font-weight:600;color:var(--texto)}
.switch{flex-shrink:0;width:72px;height:44px;border-radius:22px;border:none;padding:4px;display:flex;align-items:center;justify-content:flex-start;cursor:pointer;background:var(--texto-suave);transition:background .2s}
.switch span{width:36px;height:36px;border-radius:50%;background:#fff;display:block}
.switch.on{background:var(--verde);justify-content:flex-end}
.h-titulo{margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--texto-fuerte)}
.pasos{display:flex;gap:6px}
.pasos span{flex:1;height:8px;border-radius:4px;background:#fff}
.pasos span.lleno{background:var(--naranja)}
.sub-header{background:var(--amarillo);padding:calc(14px + env(safe-area-inset-top)) 16px 18px;border-radius:0 0 28px 28px;display:flex;align-items:center;gap:12px}
.sub-header h1{margin:0;font-size:24px;font-weight:800;color:var(--texto-fuerte)}
.back{width:48px;height:48px;border-radius:16px;background:#fff;color:var(--naranja);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.hero{background:var(--amarillo);padding:calc(44px + env(safe-area-inset-top)) 24px 30px;border-radius:0 0 36px 36px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.hero.rojo{background:var(--rojo-suave)}
.hero h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.5px;color:var(--texto-fuerte)}
.hero p{margin:0;font-size:16px}
.logo-grande{width:88px;height:88px;border-radius:26px;background:var(--naranja);color:var(--amarillo);display:flex;align-items:center;justify-content:center}
.circ-grande{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}

/* Secciones y tarjetas */
.card{background:#fff;border:1px solid var(--borde);border-radius:24px;overflow:hidden}
.card-pad{padding:18px;display:flex;flex-direction:column;gap:14px}
.card-borde{border:1px solid var(--borde);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:#fff}
.chip-tipo{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:4px 11px 4px 9px;border-radius:999px;white-space:nowrap}
.chip-tipo.dom{background:var(--suave);color:var(--naranja)}
.chip-tipo.moto{background:var(--naranja);color:#fff}
.chip-tipo.peq{font-size:12px;padding:3px 8px;gap:4px;border-radius:8px}
.paradas{display:flex;flex-direction:column}
.parada{display:flex;gap:14px;position:relative;padding-bottom:14px}
.parada:last-child{padding-bottom:0}
.parada .dot{width:14px;height:14px;border-radius:50%;margin-top:3px;flex-shrink:0;position:relative;z-index:1}
.parada.recoger .dot{background:var(--azul)}
.parada.entregar .dot{border:3px solid var(--accion);background:#fff}
.parada.recoger::before{content:'';position:absolute;left:6px;top:21px;bottom:0;border-left:2px dashed var(--azul-linea)}
.parada-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.lbl{font-size:13px;font-weight:700}
.lbl.azul{color:var(--azul-texto)} .lbl.naranja{color:var(--naranja)} .lbl.rojo{color:var(--rojo-texto)}
.nombre{font-size:18px;font-weight:700;color:var(--texto-fuerte)}
.grande-nombre{font-size:22px;font-weight:800;color:var(--texto-fuerte)}
.dir{font-size:15px;color:var(--texto-suave)}
.mini-paradas{display:flex;flex-direction:column;gap:8px}
.mini-paradas > div{display:flex;align-items:flex-start;gap:10px}
.mini-paradas .dot-azul,.mini-paradas .dot-naranja{margin-top:5px}
.mini-paradas .t{display:flex;flex-direction:column}
.mini-paradas b{font-size:16px;color:var(--texto-fuerte)}
.mini-paradas small{font-size:14px;color:var(--texto-suave)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;padding:7px 12px;border-radius:12px}
.chip.azul{background:var(--azul-suave);color:var(--azul-texto)}
.chip.morado{background:var(--morado-suave);color:var(--morado)}
.chip.gris{background:var(--gris-claro);color:var(--texto-suave)}
.chip.amarillo{background:var(--amarillo);color:var(--texto-fuerte)}
.fila-ico{display:flex;gap:14px;align-items:flex-start}
.ico-circ{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico-circ.azul{background:var(--azul-suave);color:var(--azul-texto)}
.ico-circ.naranja{background:var(--suave);color:var(--naranja)}
.ico-circ.morado{background:var(--morado-suave);color:var(--morado)}
.ico-circ.amarillo{background:var(--amarillo-suave);color:var(--naranja)}
.nota-cliente{background:var(--fondo);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;font-size:15px}
.nota-cliente svg{flex-shrink:0;margin-top:1px}
.tiempos-mini{display:flex;gap:16px;justify-content:center;align-items:center;font-size:14px;color:var(--texto-suave);flex-wrap:wrap}
.tiempos-mini span{display:inline-flex;align-items:center;gap:6px}
.morado-box{background:var(--morado-suave);border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.morado-box .circ{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--morado);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.morado-box small{font-size:14px;color:var(--morado);font-weight:700;display:block}
.morado-box b{font-size:32px;font-weight:800;letter-spacing:-.5px;line-height:1.1;color:var(--morado-fuerte);display:block}
.morado-box span.s{font-size:14px;color:var(--morado)}
.morado-fila{background:var(--morado-suave);border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.morado-fila span{font-size:15px;font-weight:700;color:var(--morado)}
.morado-fila b{font-size:26px;font-weight:800;color:var(--morado-fuerte)}
.activo-card{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:22px;background:#fff;border:2px solid var(--accion);text-align:left;width:100%;cursor:pointer;color:var(--texto)}
.item-fila{display:flex;align-items:center;gap:12px;font-size:16px;color:var(--texto-fuerte)}
.cant{width:30px;height:30px;border-radius:9px;background:var(--amarillo-suave);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Turno */
.chip-movil{align-self:flex-start;max-width:100%;height:36px;display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:0 14px 0 5px;background:var(--naranja);color:#fff;font-size:15px;font-weight:700}
.chip-movil .num{height:26px;display:inline-flex;align-items:center;background:var(--amarillo);color:var(--texto-fuerte);border-radius:999px;padding:0 9px;font-size:14px;font-weight:800;flex-shrink:0;white-space:nowrap}
.chip-movil .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-movil svg{flex-shrink:0}
.presencia{border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.presencia .ico{width:36px;height:36px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.presencia b{font-size:16px}
.presencia small{font-size:14px}
.presencia.ok{background:var(--verde-suave);border:1px solid #BBF7D0;color:var(--verde-texto)}
.presencia.ok .ico{background:var(--verde)}
.presencia.fuera{background:var(--amarillo-suave);border:1px solid #FDE68A;color:#92400E}
.presencia.fuera .ico{background:#D97706}
.turno-card{gap:10px;padding:14px 16px}
.turno-fila .t1{font-size:17px;color:var(--texto-fuerte)}
.nota-turno{background:var(--fondo);border-radius:12px;padding:9px 11px;display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.35}
.nota-turno svg{flex-shrink:0;margin-top:1px;color:var(--naranja)}
.nota-turno.fuera{background:var(--amarillo-suave)}
.nota-turno.fuera svg{color:#B45309}
.nota-turno b{color:var(--texto-fuerte)}
.lista-turno{gap:6px;padding:12px}
.lista-turno > .kv{padding:0 4px 2px}
.h-turno{margin:0;font-size:17px;font-weight:700;color:var(--naranja)}
.fila-turno{min-height:46px;padding:4px 10px;border-radius:14px;display:flex;align-items:center;gap:10px}
.fila-turno .n{width:30px;height:30px;border-radius:50%;background:var(--gris-claro);color:var(--texto-suave);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fila-turno .n.prox{background:var(--amarillo);color:var(--texto-fuerte)}
.fila-turno b{font-size:16px;color:var(--texto-fuerte);line-height:1.2}
.fila-turno .sub{font-size:13px;color:var(--texto-suave)}
.fila-turno .sub.prox{font-weight:700;color:var(--naranja)}
.fila-turno.ausente b{color:var(--texto-suave)}
.fila-turno.yo{background:var(--suave);border:2px solid var(--accion);padding:2px 8px}
.fila-turno.yo .n{background:var(--accion);color:#fff}
.fila-turno.yo b{font-weight:800}
.fila-turno.futuro{border:2px dashed var(--accion);background:var(--fondo);padding:2px 8px}
.fila-turno.futuro .n{background:none;border:2px dashed var(--accion);color:var(--naranja)}
.pill-estado{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:4px 9px;border-radius:999px;flex-shrink:0;white-space:nowrap}
.pill-estado i{width:7px;height:7px;border-radius:50%;display:block}
.pill-estado.ok{background:var(--verde-suave);color:var(--verde-texto)}
.pill-estado.ok i{background:var(--verde)}
.pill-estado.fuera{background:var(--amarillo-suave);color:#92400E}
.pill-estado.fuera i{background:#D97706}
.pie-turno{border-top:1px dashed var(--borde);margin:4px 4px 0;padding-top:8px;font-size:13px;color:var(--texto-suave)}
.etq-mini{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--texto-suave)}
.asignacion{display:flex;align-items:stretch;gap:14px;padding:14px 16px 6px}
.asig-movil{display:flex;flex-direction:column;padding-right:14px;border-right:1px solid var(--suave)}
.asig-movil b{font-size:28px;font-weight:800;line-height:1.1;color:var(--texto-fuerte)}
.asig-movil small,.asig-punto small{font-size:13px;font-weight:600;color:var(--texto-suave)}
.asig-punto{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.asig-punto b{display:flex;align-items:center;gap:6px;font-size:19px;font-weight:800;line-height:1.25;color:var(--texto-fuerte)}
.asig-punto b svg{color:var(--naranja);flex-shrink:0}
.asig-nota{margin:0;padding:0 16px 14px;font-size:13px;color:var(--texto-suave)}
.turno-fila{display:flex;align-items:center;gap:14px}
.turno-num{font-size:48px;font-weight:800;letter-spacing:-1px;line-height:1;color:var(--texto-fuerte)}

/* Botones */
.btn{height:60px;border-radius:18px;border:none;background:var(--accion);color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;cursor:pointer;width:100%;flex-shrink:0}
.btn.grande{height:64px}
.btn.sec{background:#fff;border:2px solid var(--borde);color:var(--naranja);font-size:17px;height:56px}
.btn.rojo{background:var(--rojo)}
.btn.gris{background:var(--texto-suave)}
.btn.salir{background:#fff;border:2px solid #FECACA;color:var(--rojo);font-size:18px;height:56px}
.btn-texto{height:48px;border:none;background:none;color:var(--naranja);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;width:100%;flex-shrink:0}
.btn-texto.rojo{color:var(--rojo)}
.btn:active,.btn-texto:active,.opcion:active,.fila:active,.menu-fila:active,.activo-card:active{transform:scale(.98)}
.duo{display:flex;gap:10px}
.duo > *{flex:1}
.mini{height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700;text-decoration:none;border:none;cursor:pointer}
.mini.azul{background:var(--azul-suave);color:var(--azul-texto)}
.mini.naranja{background:var(--suave);color:var(--naranja)}

/* Menú inferior */
.nav-wrap{position:sticky;bottom:0;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:var(--fondo);z-index:5}
.nav{padding:6px;background:var(--naranja);border-radius:24px;display:flex;gap:4px}
.nav button{flex:1;height:56px;border:none;border-radius:18px;background:none;color:var(--suave);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;cursor:pointer;position:relative}
.nav button.activo{background:var(--amarillo);color:var(--texto)}
.nav .punto{position:absolute;top:7px;left:calc(50% + 7px);width:11px;height:11px;border-radius:50%;background:var(--amarillo);border:2px solid var(--naranja)}
.nav .punto.blanco{background:#fff}

/* Avisos y estados */
.aviso{border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:15px}
.aviso svg{flex-shrink:0}
.aviso b{display:block;font-size:16px}
.aviso p{margin:2px 0 0;font-size:14px;color:var(--texto-suave)}
.aviso.naranja{background:var(--suave);border:1px solid var(--borde);color:var(--naranja)}
.aviso.amarillo{background:var(--amarillo-suave);color:var(--texto)}
.aviso.rojo{background:var(--rojo-suave);color:var(--rojo-texto)}
.aviso.rojo p{color:var(--rojo-texto)}
.aviso.azul{background:var(--azul-suave);color:#1E3A8A}
.aviso.azul p{color:#1E3A8A}
.vacio{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 12px;text-align:center}
.vacio .circulo{width:108px;height:108px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.vacio h2{margin:0;font-size:24px;font-weight:800;color:var(--texto-fuerte)}
.vacio p{margin:0;font-size:16px;color:var(--texto-suave);max-width:300px}
.vacio .btn,.vacio .monto-card{align-self:stretch}
.circ-amarillo{background:var(--amarillo-suave);color:var(--naranja)}
.circ-rojo{background:var(--rojo-suave);color:var(--rojo)}
.circ-gris{background:var(--gris-claro);color:var(--texto-suave)}
.monto-card{background:#fff;border:1px solid var(--borde);border-radius:18px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;text-align:left}
.monto-card small{display:block;font-size:14px;color:var(--texto-suave)}
.monto-card b{font-size:22px;font-weight:800;color:var(--texto-fuerte)}
.desc-roja{font-size:14px;font-weight:700;color:var(--rojo)}
.pill-verde{align-self:center;display:inline-flex;align-items:center;gap:8px;background:var(--verde-suave);color:var(--verde-texto);font-size:15px;font-weight:700;padding:8px 14px;border-radius:999px}
.pill-verde i{width:10px;height:10px;border-radius:50%;background:var(--verde);display:block}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.badge.gris{background:var(--gris-claro);color:var(--texto-suave)}
.badge.rojo{background:var(--rojo-suave);color:var(--rojo-texto)}
.badge.amarillo{background:var(--amarillo-suave);color:var(--texto)}
.badge.verde{background:var(--verde-suave);color:var(--verde-texto)}
.badge.naranja{background:var(--suave);color:var(--naranja)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.dot-azul{width:12px;height:12px;border-radius:50%;background:var(--azul);flex-shrink:0;display:block}
.dot-naranja{width:12px;height:12px;border-radius:50%;border:3px solid var(--accion);flex-shrink:0;display:block}

/* Formularios */
.opciones{display:flex;flex-direction:column;gap:8px}
.opcion{min-height:54px;border-radius:16px;border:1.5px solid var(--linea);background:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;text-align:left;color:var(--texto-fuerte);font-size:16px;font-weight:600;cursor:pointer;width:100%}
.opcion .radio{width:22px;height:22px;border-radius:50%;border:2px solid #D6D3D1;flex-shrink:0;background:#fff}
.opcion.sel{border:2px solid var(--accion);background:var(--fondo);font-weight:700}
.opcion.sel .radio{border:6px solid var(--accion)}
.opcion .check{color:var(--verde);display:none}
.opcion.sel .check{display:flex}
.campo{display:flex;flex-direction:column;gap:8px}
.campo label,.lbl-campo{font-size:15px;font-weight:700;color:var(--texto)}
.pregunta{font-size:18px;font-weight:700;color:var(--texto-fuerte)}
.input{height:58px;border:1.5px solid var(--borde);border-radius:16px;background:#fff;padding:0 16px;font-size:18px;color:var(--texto-fuerte);outline:none;width:100%}
.input:focus,.tel:focus-within{border-color:var(--accion);box-shadow:0 0 0 3px rgba(234,88,12,.15)}
textarea.input{height:88px;padding:12px 14px;font-size:16px;resize:none}
.tel{display:flex;align-items:center;height:58px;border:1.5px solid var(--borde);border-radius:16px;background:#fff;overflow:hidden}
.tel span{padding:0 14px;height:100%;display:flex;align-items:center;background:var(--suave);color:var(--naranja);font-weight:700;font-size:17px}
.tel input{flex:1;min-width:0;height:100%;border:none;outline:none;padding:0 14px;font-size:18px;color:var(--texto-fuerte);background:transparent}
.error{color:var(--rojo-texto);font-size:14px;font-weight:600;margin:0}
.nota-p{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--texto-suave);margin:0}
.nota-p svg{flex-shrink:0}
.subir{position:relative;min-height:140px;border-radius:20px;border:2px dashed var(--nuevo);background:#fff;color:var(--naranja);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:12px;text-align:center}
.subir img{max-height:170px;max-width:100%;border-radius:12px}
.subir input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.cred{background:var(--amarillo-suave);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cred > b{font-size:15px;color:var(--texto-fuerte)}
.cred button{min-height:56px;border-radius:14px;border:1.5px solid var(--borde);background:#fff;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:8px 14px;cursor:pointer;text-align:left}
.cred button span{font-size:15px;font-weight:700;color:var(--texto-fuerte)}
.cred button small{font-size:13px;color:var(--texto-suave)}

/* Historial y detalle */
.filtros{display:flex;gap:8px;flex-wrap:wrap}
.filtros button{height:40px;border-radius:20px;border:none;background:#fff;color:var(--naranja);padding:0 16px;font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.filtros button.sel{background:var(--naranja);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--borde);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{font-size:13px;color:var(--texto-suave);font-weight:600}
.tile b{font-size:20px;font-weight:800;color:var(--texto-fuerte);white-space:nowrap}
.etq-dia{font-size:15px;font-weight:700;color:var(--texto-suave);padding:6px 4px 0}
.etq-dia::first-letter{text-transform:uppercase}
.lista{background:#fff;border:1px solid var(--borde);border-radius:22px;overflow:hidden}
.fila{display:flex;align-items:center;gap:12px;padding:13px 16px;border:none;border-bottom:1px solid var(--suave);background:none;width:100%;text-align:left;color:var(--texto);cursor:pointer}
.fila:last-child{border-bottom:none}
.fila .hora{width:54px;display:flex;flex-direction:column;flex-shrink:0}
.fila .hora b{font-size:16px;color:var(--texto-fuerte)}
.fila .hora small{font-size:12px;color:var(--texto-suave)}
.fila .medio{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.fila .medio b{font-size:16px;color:var(--texto-fuerte);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fila .monto{font-size:16px;font-weight:800;color:var(--naranja)}
.chev{color:#A8A29E;display:flex;flex-shrink:0}
.linea-t{display:flex;align-items:center;gap:12px;font-size:16px}
.linea-t .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.linea-t .n{flex:1;font-weight:600}
.linea-t small{width:64px;text-align:right;font-size:13px;color:var(--texto-suave)}
.sep{height:1px;background:var(--suave)}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px}
.kv b{font-weight:800;color:var(--texto-fuerte)}
.titulo-card{font-size:16px;font-weight:800;color:var(--texto-fuerte);display:inline-flex;align-items:center;gap:8px}
.titulo-card svg{color:var(--naranja)}
.monto-grande{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.1;color:var(--texto-fuerte)}
.lbl-fecha{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:700;color:var(--naranja)}
.lbl-fecha.rojo{color:var(--rojo)}

/* Perfil y herramientas de prueba */
.perfil-card{display:flex;align-items:center;gap:14px;padding:16px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--amarillo);color:var(--naranja);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;flex-shrink:0}
.menu-fila{min-height:60px;padding:10px 18px;display:flex;align-items:center;gap:14px;border:none;border-bottom:1px solid var(--suave);background:none;width:100%;font-size:17px;font-weight:600;color:var(--texto-fuerte);cursor:pointer;text-align:left}
.menu-fila:last-child{border-bottom:none}
.menu-fila .ico{color:var(--naranja);display:flex}
.menu-fila .txt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.menu-fila .txt small{font-size:14px;font-weight:400;color:var(--texto-suave)}
.demo{border:2px dashed var(--borde);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.demo h3{margin:0;font-size:16px;font-weight:800;color:var(--texto-fuerte);display:flex;align-items:center;gap:8px}
.demo p{margin:0;font-size:14px;color:var(--texto-suave)}
.demo button{min-height:50px;border-radius:14px;border:1.5px solid var(--borde);background:#fff;color:var(--naranja);font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer;text-align:left}
.demo-mini{border:2px dashed var(--borde);border-radius:16px;padding:4px 8px}

/* Hojas y diálogos */
.sheet-fondo{position:fixed;inset:0;background:rgba(28,25,23,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:430px;max-height:calc(100dvh - 24px);overflow-y:auto;border-radius:28px 28px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:subir .25s ease-out}
.sheet h2{margin:0;font-size:24px;font-weight:800;color:var(--texto-fuerte)}
.sheet p.sub{margin:4px 0 0;font-size:15px;color:var(--texto-suave)}
.sheet.sin-pad{padding:0;gap:0}
.agarre{width:44px;height:5px;border-radius:3px;background:var(--linea);align-self:center;flex-shrink:0}
.sheet-centro{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.sheet-centro p{margin:0;font-size:15px;color:var(--texto-suave)}
.ico-grande{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opcion.grande-op{min-height:72px}
.op-txt{flex:1;display:flex;flex-direction:column}
.op-txt b{font-size:18px}
.op-txt small{font-size:14px;color:var(--texto-suave);font-weight:400}
.tt-head{background:var(--accion);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:14px}
.tt-head h2{color:#fff;font-size:28px;letter-spacing:-.5px}
.tt-head .s{font-size:16px;font-weight:600}
.tt-ring{position:relative;width:72px;height:72px;flex-shrink:0}
.tt-ring > span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tt-ring b{font-size:26px;font-weight:800}
.tt-ring small{font-size:12px;font-weight:700}
#tt-arco{transition:stroke-dashoffset 1s linear}
.tt-cuerpo .mini-paradas b{font-size:18px}
.mini-paradas .l{font-size:13px;font-weight:700}
.mini-paradas .l.azul{color:var(--azul-texto)}
.mini-paradas .l.naranja{color:var(--naranja)}
.asignado{font-size:14px;font-weight:600;color:var(--texto-suave)}
.resumen-tt{font-size:15px}
.nota-tt{margin:0;font-size:14px;line-height:1.35;color:var(--texto-suave)}
.tt-cuerpo{padding:18px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
@keyframes subir{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-16px);background:#44403C;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;width:max-content;max-width:calc(100% - 40px);text-align:center;z-index:30}
.toast.ver{opacity:1;transform:translateX(-50%) translateY(0)}

/* Login: grupos de perfiles */
.cred-grupo{font-size:13px;font-weight:700;color:var(--texto-suave);padding-top:4px}
.login .contenido{max-width:520px;width:100%;margin:0 auto;box-sizing:border-box}

/* ===== Oficina (central y administración) ===== */
body.staff{background:var(--fondo)}
body.staff .app{max-width:none}
.st{display:flex;min-height:100vh;min-height:100dvh}
.st-side{width:248px;flex-shrink:0;box-sizing:border-box;background:#fff;border-right:1px solid var(--borde);padding:20px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.st-marca{display:flex;align-items:center;gap:10px;padding:0 6px}
.st-logo{width:40px;height:40px;border-radius:12px;background:var(--naranja);color:var(--amarillo);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.st-marca-txt{display:flex;flex-direction:column;line-height:1.1}
.st-marca-txt b{font-size:22px;font-weight:800;letter-spacing:-.4px;color:var(--naranja)}
.st-marca-txt small{font-size:13px;font-weight:700;color:var(--texto-suave)}
.st-nav{display:flex;flex-direction:column;gap:4px;flex:1}
.st-etq{padding:12px 12px 4px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--texto-suave)}
.st-item{min-height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:12px;border:none;background:none;font-size:15px;font-weight:600;color:var(--texto);cursor:pointer;text-align:left;width:100%}
.st-item svg{color:var(--naranja);flex-shrink:0}
.st-item:hover{background:var(--fondo)}
.st-item.activo{background:var(--amarillo);color:var(--texto-fuerte);font-weight:700}
.st-item.activo svg{color:var(--texto-fuerte)}
.st-badge{margin-left:auto;min-width:22px;height:22px;box-sizing:border-box;padding:0 7px;border-radius:11px;background:var(--rojo);color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.st-user{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:16px;background:var(--fondo);border:1px solid var(--borde)}
.st-av,.av{width:38px;height:38px;border-radius:50%;background:var(--amarillo);color:var(--naranja);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.av.grande{width:52px;height:52px;font-size:19px}
.st-user-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.st-user-txt b{font-size:15px;color:var(--texto-fuerte)}
.st-user-txt small{font-size:13px;color:var(--texto-suave)}
.st-icono{width:44px;height:44px;border-radius:12px;border:none;background:transparent;color:var(--texto-suave);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex-shrink:0}
.st-icono:hover{background:var(--suave);color:var(--naranja)}
.st-main{flex:1;min-width:0;box-sizing:border-box;padding:26px 32px 40px;display:flex;flex-direction:column;gap:20px}
.st-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.st-head-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.st-head h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.5px;color:var(--texto-fuerte)}
.st-head p{margin:0;font-size:16px;color:var(--texto-suave)}
.st-head-der{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.titulo-fila{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.migas{display:flex;align-items:center;gap:6px;color:#A8A29E;font-size:15px;font-weight:600}
.migas span{color:var(--texto-suave)}
.en-linea{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--verde-suave);color:var(--verde-texto);font-size:14px;font-weight:700;white-space:nowrap}
.en-linea i{width:8px;height:8px;border-radius:50%;background:var(--verde);display:block}
.reloj{font-size:15px;font-weight:600;color:var(--texto-suave);white-space:nowrap}
.b{min-height:46px;box-sizing:border-box;padding:0 16px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700;white-space:nowrap;cursor:pointer;border:none;text-decoration:none}
.b.pri{background:var(--accion);color:#fff}
.b.sec{background:#fff;color:var(--naranja);border:2px solid var(--borde)}
.b.pel{background:#fff;color:var(--rojo-texto);border:2px solid #FECACA}
.b.suave{background:var(--suave);color:var(--naranja)}
.b.chico{min-height:40px;padding:0 12px;font-size:14px;border-radius:12px}
.b.grande{min-height:54px;font-size:17px}
.b:active,.st-item:active,.b-link:active{transform:scale(.98)}
.b-link{min-height:40px;display:inline-flex;align-items:center;gap:2px;padding:0 8px;border:none;background:none;font-size:15px;font-weight:700;color:var(--naranja);cursor:pointer;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;display:block;flex-shrink:0}
.p-buscando,.p-fuera{background:var(--amarillo-suave);color:#92400E}.p-buscando i,.p-fuera i{background:#D97706}
.p-sinmovil,.p-novedad{background:var(--rojo-suave);color:var(--rojo-texto)}.p-sinmovil i,.p-novedad i{background:var(--rojo)}
.p-aceptado{background:var(--azul-suave);color:var(--azul-texto)}.p-aceptado i{background:var(--azul)}
.p-camino,.p-pendiente{background:var(--suave);color:var(--naranja)}.p-camino i,.p-pendiente i{background:var(--accion)}
.p-ok{background:var(--verde-suave);color:var(--verde-texto)}.p-ok i{background:var(--verde)}
.p-gris{background:var(--gris-claro);color:var(--texto-suave)}.p-gris i{background:#A8A29E}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:14px}
.kpi{background:#fff;border:1px solid var(--borde);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi-et{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--texto-suave)}
.kpi b{font-size:32px;font-weight:800;letter-spacing:-.5px;line-height:1.1;color:var(--texto-fuerte)}
.kpi small{font-size:14px;color:var(--texto-suave)}
.k-ambar{background:var(--amarillo-suave);border-color:#FDE68A}.k-ambar b,.k-ambar .kpi-et svg{color:#92400E}
.k-azul b,.k-azul .kpi-et svg{color:var(--azul-texto)}
.k-rojo b,.k-rojo .kpi-et svg{color:var(--rojo-texto)}
.k-verde b,.k-verde .kpi-et svg{color:var(--verde-texto)}
.k-naranja b,.k-naranja .kpi-et svg{color:var(--naranja)}
.kpis.dos-k{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.panel{background:#fff;border:1px solid var(--borde);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-sizing:border-box}
.panel-tit{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.panel-tit h2,.h2-st{margin:0;font-size:19px;font-weight:700;color:var(--naranja)}
.dos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.dos.ancha{grid-template-columns:minmax(0,1fr) minmax(0,440px)}
.dos.parejo{grid-template-columns:repeat(2,minmax(0,1fr))}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.doble{display:flex;flex-direction:column;gap:2px;min-width:0}
.doble b{font-size:15px;font-weight:700;color:var(--texto-fuerte);white-space:nowrap}
.doble b.n{font-weight:600}
.doble small{font-size:13px;color:var(--texto-suave)}
.recorrido{display:flex;flex-direction:column;gap:3px;min-width:0}
.r-linea{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:15px;font-weight:700;color:var(--texto-fuerte)}
.r-p{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.r-a{width:9px;height:9px;border-radius:50%;background:var(--azul);display:block}
.r-b{width:9px;height:9px;box-sizing:border-box;border-radius:50%;border:2.5px solid var(--accion);display:block}
.r-flecha{display:flex;color:#A8A29E}
.recorrido small{font-size:13px;color:var(--texto-suave)}
.cd{display:flex;align-items:center;gap:8px;min-width:110px}
.cd-barra{flex:1;height:6px;border-radius:3px;background:#FDE68A;overflow:hidden;display:block}
.cd-barra i{display:block;height:100%;background:#D97706;transition:width 1s linear}
.cd-txt{font-size:13px;font-weight:800;color:#92400E;white-space:nowrap}
.chips-f{display:flex;flex-wrap:wrap;gap:8px}
.chips-f button{height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--borde);background:#fff;color:var(--naranja);font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.chips-f button span{font-size:13px;font-weight:800;padding:1px 7px;border-radius:10px;background:var(--suave)}
.chips-f button.sel{background:var(--naranja);border-color:var(--naranja);color:#fff}
.chips-f button.sel span{background:rgba(255,255,255,.22)}
.tabla-wrap{overflow-x:auto;position:relative}
.tabla{width:100%;border-collapse:collapse;font-size:15px;color:var(--texto)}
.tabla th{text-align:left;padding:10px;font-size:13px;font-weight:700;color:var(--texto-suave);border-bottom:1px solid var(--borde);white-space:nowrap}
.tabla td{padding:12px 8px;border-bottom:1px solid var(--suave);vertical-align:middle}
.tabla .der{text-align:right}
.tabla tr.f-rojo{background:#FEF2F2}.tabla tr.f-ambar{background:#FFFBEB}.tabla tr.f-sel{background:var(--fondo)}
.nw{white-space:nowrap}
.t-rojo{color:var(--rojo-texto);font-size:14px}
.t-ambar{color:#92400E;font-size:13px;font-weight:700}
.t-naranja{color:var(--naranja);font-weight:700}
.muted{color:var(--texto-suave);font-size:14px}
.b7{font-weight:700;font-size:13px}
.vacio-st{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:var(--fondo);color:var(--texto-suave);font-size:15px}
.vacio-st svg{color:var(--verde)}
.tp{display:flex;flex-direction:column;gap:8px}
.tp.tp-sep{border-top:1px solid var(--suave);padding-top:14px}
.chips-m{display:flex;flex-wrap:wrap;gap:6px}
.chip-m{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:10px;border:1.5px solid var(--verde-suave);background:#fff;font-size:14px;font-weight:700;color:var(--texto-fuerte)}
.chip-m i{width:8px;height:8px;border-radius:50%;background:var(--verde);display:block}
.chip-m.fuera{border-color:#FDE68A}.chip-m.fuera i{background:#D97706}
.aviso-st{border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.aviso-st svg{flex-shrink:0;margin-top:1px}
.aviso-st.rojo{background:var(--rojo-suave);color:var(--rojo-texto)}
.aviso-st.azul{background:var(--azul-suave);color:#1E3A8A}.aviso-st.azul svg{color:var(--azul-texto)}
.aviso-st.ambar{background:var(--amarillo-suave);color:var(--texto)}.aviso-st.ambar svg{color:#B45309}
.aviso-st.verde{background:var(--verde-suave);color:var(--verde-texto)}

const cfg = () => D.cfg;
const domi = id => D.domis.find(d => d.id === id);
const domiPorTel = tel => D.domis.find(d => d.tel === tel);
const punto = id => D.puntos.find(p => p.id === id);
const serv = id => D.servicios.find(s => String(s.id) === String(id));
const ACTIVOS = ['ofreciendo', 'sinmovil', 'aceptado', 'recogido'];
const activoDe = id => D.servicios.find(s => s.domi === id && (s.estado === 'aceptado' || s.estado === 'recogido'));
const filaDe = pid => (punto(pid) || { fila: [] }).fila;
const posEn = (pid, id) => filaDe(pid).indexOf(id) + 1;
const puedeTrabajar = d => !d.bloqueo;
const presente = d => !!d && d.conectado && d.enPunto && !d.bloqueo && !activoDe(d.id);
const nomMovil = d => d ? `Móvil ${d.movil} · ${d.corto}` : '';
const yaTermino = s => s.estado === 'entregado' || s.estado === 'cancelado';
const tFin = s => s.tiempos.entregado || s.tiempos.cancelado || s.tiempos.registrado;
const novedadAbierta = s => !!(s.novedad && !s.novedad.respuesta && !yaTermino(s));

/* ---------- Motor del turno ---------- */
function log(s, tipo, txt, det) { (s.log = s.log || []).push({ ts: ahora(), tipo, txt, det: det || '' }); }
function quitarDeFilas(id) { D.puntos.forEach(p => { p.fila = p.fila.filter(x => x !== id); }); }
function meterAlTurno(id, dePrimero) {
  const d = domi(id); if (!d) return;
  quitarDeFilas(id);
  const f = filaDe(d.punto); if (dePrimero) f.unshift(id); else f.push(id);
}
/* Ofrece el servicio al primero del turno que esté en el punto (saltando a los que están fuera) */
function ofrecer(s) {
  const t = ahora(), f = filaDe(s.punto), saltados = [];
  for (const id of f) {
    if ((s.yaOfrecido || []).includes(id)) continue;
    const d = domi(id);
    if (!presente(d)) { saltados.push(d); continue; }
    saltados.forEach(x => log(s, 'salto', `Se saltó a ${nomMovil(x)}`, 'Estaba fuera del punto · conserva su lugar'));
    s.saltos = (s.saltos || 0) + saltados.length;
    s.estado = 'ofreciendo'; s.ofrecidoA = id; s.ofrecidoDesde = t; s.ofrecidoHasta = t + cfg().seg * 1000;
    s.simAcepta = d.sim ? t + rnd(SIM.acepta[0], SIM.acepta[1]) : null;
    log(s, 'oferta', `Ofrecido a ${nomMovil(d)}`, `Estaba en el punto · tiene ${cfg().seg} s`);
    return true;
  }
  saltados.forEach(x => log(s, 'salto', `Se saltó a ${nomMovil(x)}`, 'Estaba fuera del punto · conserva su lugar'));
  s.saltos = (s.saltos || 0) + saltados.length;
  if (s.estado !== 'sinmovil' || !s.fueSinMovil) log(s, 'sinmovil', 'Sin móvil', f.length ? 'Nadie del turno está en el punto ahora' : 'No hay móviles en el turno');
  s.estado = 'sinmovil'; s.ofrecidoA = null; s.fueSinMovil = true;
  return false;
}
function crearServicio(datos, quien) {
  const t = ahora();
  const s = Object.assign({ id: D.nextId++, yaOfrecido: [], noAcepto: [], saltos: 0, tiempos: { registrado: t }, log: [] }, datos);
  log(s, 'registro', `Registrado por ${quien}`, ORIGEN_TXT[s.origen] || '');
  log(s, 'turno', `Enviado al turno de ${punto(s.punto).corto}`, plural(filaDe(s.punto).length, 'móvil en el turno', 'móviles en el turno'));
  D.servicios.push(s);
  ofrecer(s);
  return s;
}
function aceptar(s, id) {
  const t = ahora(), d = domi(id);
  s.estado = 'aceptado'; s.domi = id; s.tiempos.asignado = s.ofrecidoDesde; s.tiempos.aceptado = t;
  s.aceptoEn = Math.max(1, Math.round((t - s.ofrecidoDesde) / 1000)); s.ofrecidoA = null; s.ofrecidoHasta = null;
  quitarDeFilas(id);
  log(s, 'aceptado', `Aceptado por ${nomMovil(d)}`, `Aceptó en ${s.aceptoEn} s`);
  if (d.sim) s.simRecoge = t + rnd(SIM.recoge[0], SIM.recoge[1]);
}
function seVencioOferta(s) {
  const d = domi(s.ofrecidoA);
  (s.yaOfrecido = s.yaOfrecido || []).push(s.ofrecidoA);
  (s.noAcepto = s.noAcepto || []).push(s.ofrecidoA);
  if (cfg().noAcepta === 'ultimo') {
    const f = filaDe(s.punto); const i = f.indexOf(s.ofrecidoA);
    if (i >= 0) { f.splice(i, 1); f.push(s.ofrecidoA); }
    log(s, 'noacepto', `${nomMovil(d)} no respondió en ${cfg().seg} s`, 'Quedó de último en el turno');
  } else log(s, 'noacepto', `${nomMovil(d)} no respondió en ${cfg().seg} s`, 'Conserva su lugar en el turno');
  ofrecer(s);
}
function recoger(s) { s.estado = 'recogido'; s.tiempos.recogido = ahora(); log(s, 'recogido', s.tipo === 'mototaxi' ? 'Recogió al pasajero' : `Recogido en ${cortoNegocio(s.negocio)}`); if (domi(s.domi).sim) s.simEntrega = ahora() + rnd(SIM.entrega[0], SIM.entrega[1]); }
function entregar(s, pago) {
  const t = ahora(), d = domi(s.domi);
  s.estado = 'entregado'; s.tiempos.entregado = t; s.cobrado = s.cobrar; s.pago = s.cobrar > 0 ? pago : 'pagado';
  log(s, 'entregado', s.tipo === 'mototaxi' ? 'Carrera terminada' : `Entregado a ${s.cliente}`, s.cobrar > 0 ? `Cobró ${fmt(s.cobrar)} · ${pago === 'transferencia' ? 'transferencia' : 'efectivo'}` : 'Ya estaba pagado');
  if (puedeTrabajar(d) && d.conectado) meterAlTurno(d.id, false);
  d.enPunto = false; if (d.sim) d.vueltaEn = t + SIM.vuelve;
}
function cancelarServicio(s, motivo, por) {
  const t = ahora(), d = s.domi ? domi(s.domi) : null, recogido = s.estado === 'recogido', tenia = s.estado === 'aceptado' || recogido;
  s.cancel = { motivo, por }; s.tiempos.cancelado = t; s.ofrecidoA = null;
  log(s, 'cancelado', por === 'central' ? 'Cancelado por la central' : `Cancelado por ${nomMovil(d)}`, motivo);
  s.estado = 'cancelado';
  if (d && tenia) {
    if (puedeTrabajar(d) && d.conectado) meterAlTurno(d.id, por === 'central' && cfg().cancelaCentral === 'primero');
    if (recogido) { d.enPunto = false; if (d.sim) d.vueltaEn = t + SIM.vuelve; }
    if (por === 'central' && !d.sim) d.aviso = { tipo: 'cancelado', id: s.id, ts: t };
  }
}
function reportarNovedad(s, texto, nota) { s.novedad = { texto, nota, ts: ahora(), respuesta: null }; log(s, 'novedad', `Novedad: ${texto}`, nota || ''); }
function responderNovedad(s, resp) {
  s.novedad.respuesta = resp; s.novedad.respondida = ahora();
  log(s, 'respuesta', `La central respondió: ${resp}`);
  if (resp === 'Cancelar el servicio') { cancelarServicio(s, 'Novedad: ' + s.novedad.texto, 'central'); return; }
  const d = domi(s.domi);
  if (d && d.sim) { if (s.estado === 'recogido') s.simEntrega = ahora() + 40000; else s.simRecoge = ahora() + 30000; }
}
function reasignar(s, pid) {
  const antes = punto(s.punto).corto;
  s.punto = pid; s.yaOfrecido = []; s.reasignado = true; s.ofrecidoA = null; s.estado = 'sinmovil';
  log(s, 'reasignado', `Reasignado de ${antes} a ${punto(pid).corto}`);
  ofrecer(s);
}
function sacarDelTurno(id, motivo, quien) {
  const d = domi(id); quitarDeFilas(id);
  d.aviso = { tipo: 'sacado', motivo, ts: ahora(), quien };
}

/* Corre cada segundo en todas las pestañas: vence ofertas y mueve a los móviles simulados */
function motor() {
  const t = ahora(); let c = false;
  D.servicios.forEach(s => {
    if (yaTermino(s)) return;
    if (s.estado === 'ofreciendo') {
      const d = domi(s.ofrecidoA);
      if (!presente(d)) { (s.yaOfrecido = s.yaOfrecido || []).push(s.ofrecidoA); log(s, 'salto', `${nomMovil(d)} ya no está disponible`, 'Se ofrece al siguiente'); ofrecer(s); c = true; }
      else if (d.sim && s.simAcepta && t >= s.simAcepta) { aceptar(s, d.id); c = true; }
      else if (t >= s.ofrecidoHasta) { seVencioOferta(s); c = true; }
    } else if (s.estado === 'sinmovil') {
      if (filaDe(s.punto).some(id => !(s.yaOfrecido || []).includes(id) && presente(domi(id)))) { log(s, 'turno', 'Llegó un móvil al punto', 'Se vuelve a ofrecer'); ofrecer(s); c = true; }
    } else if (s.domi && domi(s.domi).sim && !novedadAbierta(s)) {
      if (s.estado === 'aceptado' && s.simRecoge && t >= s.simRecoge) { recoger(s); c = true; }
      else if (s.estado === 'recogido' && s.simEntrega && t >= s.simEntrega) { entregar(s, Math.random() < 0.25 ? 'transferencia' : 'efectivo'); c = true; }
    }
  });
  D.domis.forEach(d => { if (d.sim && d.vueltaEn && t >= d.vueltaEn) { d.enPunto = true; d.vueltaEn = null; c = true; } });
  return c;
}

/* ---------- Cuotas ---------- */
function aprobarPago(d, medio) {
  const t = ahora();
  d.pagos = d.pagos || [];
  d.pagos.unshift({ medio: medio || (d.comprobante && d.comprobante.medio) || 'Efectivo', ts: t, semana: rangoSemana(0) });
  d.cuota = 'al_dia'; d.debe = 0; d.rechazo = null; d.comprobante = null;
  if (d.bloqueo === 'cuota') {
    d.bloqueo = null;
    if (d.conectado && !activoDe(d.id)) meterAlTurno(d.id, false);
  }
}
function rechazarPago(d, motivo) { d.rechazo = motivo; d.comprobante = null; d.cuota = d.bloqueo === 'cuota' ? 'vencida' : 'pendiente'; }
function corteSemana() {
  let n = 0;
  D.domis.forEach(d => { if (d.cuota === 'pendiente') { d.cuota = 'vencida'; d.debe = (d.debe || 0) + 1; n++; if (cfg().bloqueoAuto) { d.bloqueo = 'cuota'; quitarDeFilas(d.id); } } });
  return n;
}

  const el = document.getElementById('toast');
  el.textContent = txt; el.classList.add('ver');

}

function ir(p, params = {}, push = true) {
  S.pantalla = p; S.params = params; S.sheet = null; S.sheetParams = {}; S.sel = {};
  if (p !== 'c_nuevo') S.form = null;
  if (push) history.pushState({ p, params }, '');
  render(); window.scrollTo(0, 0);
}
function abrirSheet(nombre, params = {}) { S.sheet = nombre; S.sheetParams = params; S.sel = {}; render(); }
function cerrarSheet() { S.sheet = null; S.sheetParams = {}; render(); }
window.addEventListener('popstate', e => {
  if (S.sheet) {
    if (S.sheet !== 'tetoca') cerrarSheet();
    history.pushState({ p: S.pantalla, params: S.params }, '');
    return;
  }
  if (!S.tel) { S.pantalla = 'login'; render(); return; }
  const st = e.state || {};
  S.pantalla = st.p && st.p !== 'login' ? st.p : inicio();
  S.params = st.params || {}; S.sel = {};
  render(); window.scrollTo(0, 0);
});

/* ---------- Turno: piezas ---------- */
function filaTurno(id, i, proximo, ofreciendoA) {
  const d = domi(id), yo = id === U().id, pres = presente(d), prox = id === proximo;
  const sub = ofreciendoA === id ? '<span class="sub prox">Se le está ofreciendo un servicio</span>'
    : prox ? '<span class="sub prox">Recibe el próximo</span>'
    : !pres ? `<span class="sub">${yo ? 'Lugar guardado' : 'Conserva su lugar'}</span>`
    : '<span class="sub">En espera</span>';
  const pill = pres ? '<span class="pill-estado ok"><i></i>En el punto</span>' : '<span class="pill-estado fuera"><i></i>Fuera · se salta</span>';
  return `<div class="fila-turno ${yo ? 'yo' : ''} ${!pres && !yo ? 'ausente' : ''}">
    <span class="n ${prox && !yo ? 'prox' : ''}">${i + 1}</span>
    <span class="parada-txt" style="flex:1"><b>Móvil ${d.movil} · ${yo ? 'Tú' : esc(d.corto)}</b>${sub}</span>${pill}</div>`;
}
function listaTurno(enServicio) {
  const pi = miPunto(), f = pi.fila, proximo = f.find(id => presente(domi(id)));
  const ofreciendo = D.servicios.find(s => s.estado === 'ofreciendo' && s.punto === pi.id);
  const n = f.length;
  const futuro = enServicio ? `<div class="fila-turno futuro"><span class="n">${n + 1}</span><span class="parada-txt" style="flex:1"><b>Móvil ${U().movil} · Tú</b><span class="sub">Entras aquí al terminar</span></span></div>` : '';
  const enCalle = D.domis.filter(d => d.punto === pi.id && activoDe(d.id) && d.id !== U().id).map(d => String(d.movil));
  const pie = enServicio ? 'Al terminar, tu turno cuenta cuando vuelvas al punto.' : enCalle.length ? `En servicio: Móvil ${enLista(enCalle)} · al volver entran de últimos` : 'El servicio va al primero del turno que esté en el punto';
  return `<article class="card"><div class="card-pad lista-turno">
    <div class="kv"><h2 class="h-turno">Turno de ${esc(pi.corto)}${enServicio ? ' ahora' : ''}</h2><span class="etq-mini">${enServicio ? plural(n, 'móvil', 'móviles') : 'Orden de llegada'}</span></div>
    ${f.map((id, i) => filaTurno(id, i, proximo, ofreciendo && ofreciendo.ofrecidoA)).join('') || '<p class="dir" style="margin:4px">Nadie en el turno por ahora.</p>'}${futuro}
    <div class="pie-turno">${pie}</div>
  </div></article>`;
}

PANTALLAS.turno = () => {
  const d = U(), pi = miPunto();
  if (!libre()) return pantallaBloqueo();
  if (miActivo()) return pantallaEnServicio();
  if (!d.conectado) {
    return `<div class="pantalla">${headerCompleto('Desconectado · fuera del turno')}<main class="contenido">
      ${vacio('gris', 'moto', 'Estás desconectado', `Conéctate para entrar al turno de ${esc(pi.corto)}. Entras de último.`, `<button class="btn" data-accion="switch">Conectarme</button>`)}
    </main>${nav('turno')}</div>`;
  }
  const pos = miPos();
  if (!pos) {
    const sac = d.aviso && d.aviso.tipo === 'sacado' ? d.aviso : null;
    return `<div class="pantalla">${headerCompleto('Fuera del turno')}<main class="contenido">
      ${vacio('amarillo', 'list', sac ? 'La central te sacó del turno' : 'No estás en el turno', sac ? `Motivo: ${esc(sac.motivo)}. Si ya puedes trabajar, vuelve a entrar.` : `Entra al turno de ${esc(pi.corto)} para recibir servicios.`, `<button class="btn" data-accion="entrar-turno">Entrar al turno (de último)</button>`)}
    </main>${nav('turno')}</div>`;
  }
  const f = pi.fila, presente_ = d.enPunto;
  const banner = presente_
    ? `<div class="presencia ok" role="status"><span class="ico">${ic('check', 20, 2.5)}</span><span class="parada-txt"><b>Estás en el punto</b><small>Tu GPS te ubica en ${esc(pi.corto)}</small></span></div>`
    : `<div class="presencia fuera" role="status"><span class="ico">${ic('pinAlerta', 20, 2.4)}</span><span class="parada-txt"><b>Estás fuera del punto</b><small>Tu GPS te ubica a ${DIST_FUERA} de ${esc(pi.corto)}</small></span></div>`;
  let l1, l2, nota;
  if (presente_) {
    const antes = f.slice(0, pos - 1).filter(id => presente(domi(id)));
    l1 = `de ${f.length} en el turno`;
    l2 = !antes.length ? 'Recibes el próximo servicio' : antes.length === 1 ? `Te toca después de Móvil ${domi(antes[0]).movil}` : `Antes de ti hay ${antes.length} en el punto`;
    nota = `<div class="nota-turno">${ic('zap', 17, 2.2)}<span>El próximo servicio te llega solo: domicilio o mototaxi. Tendrás ${cfg().seg}&nbsp;s para aceptarlo.</span></div>`;
  } else {
    const otro = f.find(id => id !== d.id && presente(domi(id)));
    l1 = 'Conservas tu lugar';
    l2 = 'pero no recibes servicios fuera del punto';
    nota = `<div class="nota-turno fuera">${ic('info', 17, 2.2)}<span>${otro ? `El próximo servicio es para <b>Móvil ${domi(otro).movil}</b>, que sí está en el punto.` : 'Nadie más está en el punto.'} Cuentas como presente a menos de ${punto(d.punto).radio || cfg().radio}&nbsp;m.</span></div>`;
  }
  const tarjeta = `<article class="card"><div class="card-pad turno-card">
    <span class="lbl naranja" style="font-size:14px">Tu turno en ${esc(pi.corto)}</span>
    <div class="turno-fila"><span class="turno-num">${pos}°</span><div class="parada-txt"><b class="t1">${l1}</b><span class="dir">${l2}</span></div></div>
    ${nota}
  </div></article>`;
  return `<div class="pantalla">${headerCompleto()}<main class="contenido">${banner}${tarjeta}${listaTurno(false)}${demoTurno()}</main>${nav('turno')}</div>`;
};
function pantallaEnServicio() {
  const a = miActivo(), p = a, v = V(p), pi = miPunto();

  return `<div class="pantalla">${headerCompleto('', true)}<main class="contenido">

function pantallaBloqueo() {

PANTALLAS.historial = () => {
  const f = S.filtro;
  const lista = misHechos().filter(h => f === 'semana' ? tFin(h) >= lunes(0).getTime() : (f === 'hoy' ? esHoy(tFin(h)) : esAyer(tFin(h))));
  const ok = lista.filter(h => h.estado === 'entregado');
  const suma = ok.reduce((s, h) => s + h.valor, 0);
  const prom = ok.length ? Math.round(ok.reduce((s, h) => s + (h.tiempos.entregado - h.tiempos.aceptado), 0) / ok.length / 60000) : 0;
  const filtros = `<div class="filtros">${[['hoy', 'Hoy'], ['ayer', 'Ayer'], ['semana', 'Esta semana']].map(([k, l]) => `<button class="${f === k ? 'sel' : ''}" data-accion="filtro" data-v="${k}" aria-pressed="${f === k}">${l}</button>`).join('')}</div>`;
  const etiqueta = f === 'hoy' ? 'Hoy · ' + fechaLarga(new Date()) : f === 'ayer' ? 'Ayer · ' + fechaLarga(new Date(ahora() - 864e5)) : 'Esta semana';
  const filas = lista.length ? `<div class="lista">${lista.slice(0, 60).map(filaHistorial).join('')}</div>` : vacio('gris', 'history', 'Sin servicios en este periodo', 'Aquí verás los pedidos y carreras que hagas.');
  return `<div class="pantalla">${headerTab('Historial', filtros)}<main class="contenido">
    <div class="tiles"><div class="tile"><span>Servicios</span><b>${ok.length}</b></div><div class="tile"><span>Ganado</span><b style="color:var(--naranja)">${fmt(suma)}</b></div><div class="tile"><span>Prom. entrega</span><b>${prom ? prom + ' min' : '—'}</b></div></div>
    <div class="etq-dia">${etiqueta}</div>${filas}

};
function filaHistorial(h) {
  const v = V(h), ok = h.estado === 'entregado';

PANTALLAS.detalle = () => {
  const h = serv(S.params.id);
  if (!h) return PANTALLAS.historial();
  const v = V(h), t = h.tiempos, ok = h.estado === 'entregado';
  const pasos = [['Asignado', '#A8A29E', t.asignado || t.registrado], [v.aceptado, 'var(--accion)', t.aceptado]];
  if (t.recogido) pasos.push(['Recogido', 'var(--azul)', t.recogido]);
  pasos.push(ok ? [v.hecho, 'var(--naranja)', t.entregado] : [v.cancelado, 'var(--rojo)', t.cancelado]);
  const filas = pasos.filter(p => p[2]).map(([n, col, ts], i, arr) => `<div class="linea-t"><span class="dot" style="background:${col}"></span><span class="n">${n}</span><span>${hora(ts)}</span><small>${i ? delta(ts - arr[i - 1][2]) : ''}</small></div>`).join('');
  const pago = h.cobrado > 0 ? `${fmt(h.cobrado)} · ${h.pago === 'transferencia' ? 'Transferencia' : 'Efectivo'}` : (ok ? 'Ya estaba pagado' : '—');
  const pi = punto(h.punto);
  return `<div class="pantalla">${subHeader(v.m ? 'Detalle de la carrera' : 'Detalle del pedido', 'historial')}<main class="contenido">
    <article class="card"><div class="card-pad">
      <div class="kv"><span style="display:inline-flex;align-items:center;gap:8px">${chipTipo(h)}<span style="font-size:15px;font-weight:700;color:var(--texto-suave)">#${h.id}</span></span>${ok ? `<span class="badge gris">${ic('check', 13, 3)}${v.hecho}</span>` : `<span class="badge rojo">${ic('x', 13, 3)}${v.cancelado}</span>`}</div>
      ${paradas(v.lblA, v.aOk, v.daOk, v.lblB, v.bOk, v.dbOk)}
      <div class="kv" style="font-size:15px"><span style="color:var(--texto-suave)">Llegó por</span><b>Turno · ${esc(pi ? pi.corto : '')}</b></div>
    </div></article>
    ${ok ? '' : `<div class="aviso rojo">${ic('alert')}<div><b>${h.cancel && h.cancel.por === 'central' ? 'Cancelado por la central' : 'Cancelado por ti'}</b><p>${esc(h.cancel ? h.cancel.motivo : '')}</p></div></div>`}
    ${v.m ? cardPasajero(h, false) : cardQueLlevas(h, ok ? 'Qué llevaste' : 'Qué ibas a llevar')}
    <article class="card"><div class="card-pad">
      <span class="titulo-card">${ic('clock', 20)} Tiempos</span>${filas}
      ${ok ? `<div class="sep"></div><div class="kv"><span style="font-weight:700;color:var(--texto-fuerte)">Tiempo total</span><b style="font-size:22px;color:var(--naranja)">${Math.round((t.entregado - t.aceptado) / 60000)} min</b></div>` : ''}
    </div></article>
    <article class="card"><div class="card-pad" style="gap:12px">
      <span class="titulo-card">${ic('cash', 20)} Dinero</span>
      <div class="kv"><span>${v.valorLbl}</span><b>${fmt(ok ? h.valor : 0)}</b></div>
      <div class="kv"><span>Cobrado</span><b style="color:var(--morado)">${pago}</b></div>
    </div></article>
  </main></div>`;

const STP = {};
STP.c_despacho = () => {
  const lista = enCurso(), hoyHechos = D.servicios.filter(s => yaTermino(s) && esHoy(tFin(s)));
  const buscando = lista.filter(s => s.estado === 'ofreciendo' || s.estado === 'sinmovil');
  const curso = lista.filter(s => s.estado === 'aceptado' || s.estado === 'recogido');
  const nov = novedadesAbiertas();
  const ent = hoyHechos.filter(s => s.estado === 'entregado');
  const prom = ent.length ? Math.round(ent.reduce((a, s) => a + (s.tiempos.entregado - s.tiempos.aceptado), 0) / ent.length / 60000) : 0;
  const k = `<div class="kpis">${kpi('Buscando móvil', buscando.length, 'Se están ofreciendo por turno', 'ambar', 'clock')}${kpi('En curso', curso.length, 'Aceptados o en camino', 'azul', 'moto')}${kpi('Novedades', nov.length, nov.length ? 'Esperan tu respuesta' : 'Todo en orden', 'rojo', 'alert')}${kpi('Entregados hoy', ent.length, prom ? `Entrega promedio ${prom} min` : '', 'verde', 'check')}</div>`;

  const head = `<nav class="migas" aria-label="Ruta"><button class="b-link" data-accion="ir" data-a="c_despacho">Despacho</button>${ic('chev', 16, 2.4)}<span>Servicio #${s.id}</span></nav>
    <header class="st-head"><div class="st-head-txt"><div class="titulo-fila"><h1>Servicio #${s.id}</h1>${chipTipo(s)}${estadoPill(s)}</div>
    <p>Llegó por ${esc((ORIGEN_TXT[s.origen] || '').replace(/^El r/, 'el r').replace(/^W/, 'W'))} · lo registró ${esc(s.registradoPor)} a las ${hora(s.tiempos.registrado)} · Turno de ${esc(pt.corto)}</p></div>
    ${acciones ? `<div class="st-head-der">${acciones}</div>` : ''}</header>`;
  const recorridoP = panel('Recorrido', paradas(v.lblA, v.aOk, v.daOk, v.lblB, `${v.bOk}${s.celular ? ' · ' + telFmt(s.celular) : ''}`, `${v.dbOk}${!v.m && s.nota ? ' · ' + s.nota : ''}`)
    + `<div class="chips">${chipKm(s)}${v.m ? `<span class="chip morado">${ic('cash', 16)} Carrera ${fmt(s.cobrar)}</span>` : chipCobro(s)}${!v.m ? `<span class="chip amarillo">Domicilio ${fmt(s.valor)}</span>` : ''}</div>`);
  const carga = v.m ? cardPasajero(s) : cardQueLlevas(s, 'Qué lleva');
  let quien = '';
  if (d) {
    quien = panel('Domiciliario', `<div class="fila-ico" style="align-items:center">${avatar(d, 'grande')}${doble(esc(nomMovil(d)).replace(' · ', ' · ') + ' ' + esc(d.nombre.split(' ').slice(1).join(' ')), `${telFmt(d.tel)} · ${esc(d.placa)} · ${esc(d.moto)}`)}</div>
      <div class="fila-b">${b('Llamar', 'st-llamar', 'suave chico', 'phone')}${b('WhatsApp', 'st-llamar', 'suave chico', 'wa')}</div>
      ${activo ? `<div class="aviso-st ambar">${ic('info', 17, 2.2)}<span>Si cancelas este servicio, Móvil ${d.movil} vuelve ${cfg().cancelaCentral === 'primero' ? 'de primero' : 'de último'} al turno de ${esc(punto(d.punto).corto)}.</span></div>` : ''}`, CUOTA_PILL(d));
  } else if (s.estado === 'ofreciendo') {
    quien = panel('Ofreciendo', `<div class="doble"><b>${esc(nomMovil(domi(s.ofrecidoA)))}</b><small>Tiene ${cfg().seg} s para aceptar. Si no, pasa al siguiente que esté en el punto.</small></div>${cuentaAtras(s)}`);
  } else if (s.estado === 'sinmovil') {
    quien = panel('Sin móvil', `<div class="aviso-st rojo">${ic('alert', 17, 2.2)}<span>Nadie del turno de ${esc(pt.corto)} está en el punto. Se ofrecerá apenas alguien llegue, o reasígnalo a otro punto.</span></div><div class="fila-b">${b('Reasignar a otro punto', 'st-reasignar', 'suave', 'swap', `data-id="${s.id}"`)}</div>`);
  }
  const nov = s.novedad ? `<div class="aviso-st ${s.novedad.respuesta ? 'azul' : 'rojo'}">${ic(s.novedad.respuesta ? 'msg' : 'alert', 17, 2.2)}<span><b>Novedad: ${esc(s.novedad.texto)}</b>${s.novedad.nota ? ` · ${esc(s.novedad.nota)}` : ''}${s.novedad.respuesta ? ` · Respondiste: ${esc(s.novedad.respuesta)}` : ` · ${hace(s.novedad.ts)}`}</span></div>` : '';
  const L = logDe(s);
  const fin = s.tiempos.entregado || s.tiempos.cancelado || ahora();
  const total = Math.max(1, Math.round((fin - s.tiempos.registrado) / 60000));
  const pendiente = activo ? (s.estado === 'recogido' ? `Entrega a ${v.cliente}` : s.estado === 'aceptado' ? (v.m ? 'Recoger al pasajero' : 'Recoger en el negocio') : 'Que un móvil lo acepte') : '';
  const items = L.map((e, i) => `<li><span class="tl-dot" style="background:${COLOR_LOG[e.tipo] || 'var(--accion)'}"></span><span class="tl-txt"><b>${esc(e.txt)}</b>${e.det ? `<small>${esc(e.det)}</small>` : ''}</span><span class="tl-hora">${horaSeg(e.ts)}</span></li>`).join('')
    + (pendiente ? `<li class="pend"><span class="tl-dot"></span><span class="tl-txt"><b>${esc(pendiente)}</b><small>Pendiente</small></span><span class="tl-hora">—</span></li>` : '');
  const traz = panel('Trazabilidad', `<div class="kpis dos-k">${kpi(activo ? 'Tiempo hasta ahora' : 'Tiempo total', total + ' min', 'desde que se registró', 'neutro', 'clock')}${kpi('Aceptó en', s.aceptoEn ? s.aceptoEn + ' s' : '—', `de ${cfg().seg} s`, 'azul', 'check')}</div>
    <ol class="tl">${items}</ol>`, '<small class="muted">Cada paso queda guardado</small>');
  return stLayout('c_despacho', head + nov + `<div class="dos ancha">${'<div class="col">' + recorridoP + carga + quien + '</div>'}<div class="col">${traz}</div></div>`);
};

/* ---------- Turnos ---------- */
function motivoFuera(d) {
  if (d.bloqueo === 'admin') return 'Cuenta bloqueada';
  if (d.bloqueo === 'cuota') return d.cuota === 'revision' ? 'Cuota en revisión' : 'Cuota vencida';
  if (!d.conectado) return 'Desconectado';
  if (d.aviso && d.aviso.tipo === 'sacado') return `Lo sacó la central: ${d.aviso.motivo}`;
  return 'No ha entrado al turno';
}
STP.c_turnos = () => {
  const lista = S.puntoF === 'todos' ? D.puntos : D.puntos.filter(p => p.id === S.puntoF);
  const cards = lista.map(pt => {
    const f = pt.fila, pres = f.filter(id => presente(domi(id)));
    const primero = pres[0];
    const enServ = D.domis.filter(d => d.punto === pt.id && activoDe(d.id));
    const fuera = D.domis.filter(d => d.punto === pt.id && !f.includes(d.id) && !activoDe(d.id));
    const sinM = D.servicios.filter(s => s.estado === 'sinmovil' && s.punto === pt.id);
    const ofr = D.servicios.find(s => s.estado === 'ofreciendo' && s.punto === pt.id);
    const fila = (id, i) => {
      const d = domi(id), p = presente(d);
      const sub = ofr && ofr.ofrecidoA === id ? `<small class="t-ambar">Ofreciendo #${ofr.id} · ${cuentaAtras(ofr)}</small>` : id === primero ? '<small class="t-naranja">Recibe el próximo</small>'
        : !p ? `<small>${d.vueltaEn ? 'Volviendo al punto' : `Fuera del punto · a ${DIST_FUERA}`}</small>` : '<small>En el punto</small>';
      return `<div class="fila-turno ${!p ? 'ausente' : ''}"><span class="n ${id === primero ? 'prox' : ''}">${i + 1}</span><span class="parada-txt" style="flex:1"><b>${esc(nomMovil(d))}</b>${sub}</span>
        ${p ? '<span class="pill-estado ok"><i></i>En el punto</span>' : '<span class="pill-estado fuera"><i></i>Fuera · se salta</span>'}
        <button class="st-icono" data-accion="st-opciones" data-id="${d.id}" aria-label="Opciones de ${esc(nomMovil(d))}">${ic('more', 20, 2.4)}</button></div>`;
    };
    const sv = enServ.map(d => { const s = activoDe(d.id); return `<div class="kv-st"><b>${esc(nomMovil(d))}</b><span class="fila-b"><button class="b-link" data-accion="ir" data-a="c_detalle" data-id="${s.id}">#${s.id}</button>${estadoPill(s)}</span></div>`; }).join('');
    const fu = fuera.map(d => `<div class="kv-st"><span class="doble"><b class="n">${esc(nomMovil(d))}</b><small>${esc(motivoFuera(d))}</small></span><button class="st-icono" data-accion="st-opciones" data-id="${d.id}" aria-label="Opciones de ${esc(nomMovil(d))}">${ic('more', 20, 2.4)}</button></div>`).join('');
    const stats = `<div class="chips-stat"><span>${plural(f.length, 'en turno', 'en turno')}</span><span class="${pres.length ? 'ok' : 'rojo'}">${pres.length ? plural(pres.length, 'en el punto', 'en el punto') : 'Nadie en el punto'}</span><span class="nar">${plural(enServ.length, 'en servicio', 'en servicio')}</span></div>`;
    return `<section class="panel"><div class="fila-ico"><span class="ico-circ naranja" style="width:44px;height:44px">${ic('store', 22)}</span><span class="doble"><b style="font-size:18px">${esc(pt.nombre)}</b><small>${esc(pt.dir)} · radio ${pt.radio || cfg().radio} m</small></span></div>
      ${stats}
      ${sinM.length ? `<div class="aviso-st rojo">${ic('alert', 17, 2.2)}<span>Nadie está en el punto: <b>#${sinM.map(s => s.id).join(', #')}</b> espera móvil.</span></div><div class="fila-b">${b('Reasignar a otro punto', 'st-reasignar', 'suave chico', 'swap', `data-id="${sinM[0].id}"`)}</div>` : ''}
      <div><small class="muted b7">Turno · orden de llegada</small><div class="lista-turno">${f.map(fila).join('') || '<p class="muted">Nadie en el turno.</p>'}</div></div>
      ${sv ? `<div class="caja-suave"><small class="muted b7">En servicio</small>${sv}</div>` : ''}
      ${fu ? `<div class="caja-suave"><small class="muted b7">Fuera del turno</small>${fu}</div>` : ''}
    </section>`;
  }).join('');
  const sel = `<label class="sr-only" for="f-puntoF">Filtrar por punto</label><select id="f-puntoF" class="sel-st" data-accion-change="punto-f"><option value="todos" ${S.puntoF === 'todos' ? 'selected' : ''}>Todos los puntos</option>${D.puntos.map(p => `<option value="${p.id}" ${S.puntoF === p.id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select>`;
  const head = stHeader('Turnos de los puntos', 'Quién sigue en cada punto, quién está fuera y quién está en servicio.', enLinea('Se actualiza solo') + sel);
  const ley = `<div class="aviso-st info">${ic('info', 17, 2.2)}<span>El servicio va al primero del turno que esté en el punto. Quien está fuera se salta pero conserva su lugar. En <b>⋯</b> puedes sacar a alguien del turno (queda el motivo) o simular que llega o sale del punto.</span></div>`;
  return stLayout('c_turnos', head + ley + `<div class="grid-puntos">${cards}</div>`);
};

/* ---------- Novedades ---------- */
STP.c_novedades = () => {
  const abiertas = novedadesAbiertas();
  const resp = D.servicios.filter(s => s.novedad && s.novedad.respuesta && esHoy(s.novedad.ts)).sort((a, c) => c.novedad.respondida - a.novedad.respondida);
  const item = (s, abierta) => { const d = domi(s.domi); return `<div class="nov-item grande"><div class="fila-ico" style="align-items:center">${avatar(d)}${doble(`#${s.id} · ${esc(nomMovil(d))}`, `${esc(V(s).titulo)} · ${hace(s.novedad.ts)}`)}</div>
    <div class="aviso-st ${abierta ? 'rojo' : 'azul'}">${ic(abierta ? 'alert' : 'msg', 17, 2.2)}<span><b>${esc(s.novedad.texto)}</b>${s.novedad.nota ? ' · ' + esc(s.novedad.nota) : ''}${abierta ? '' : ` · Respuesta: ${esc(s.novedad.respuesta)}`}</span></div>
    <div class="fila-b">${abierta ? b('Responder', 'st-novedad', 'pri chico', 'msg', `data-id="${s.id}"`) : ''}${verBtn(s.id, 'Ver servicio')}</div></div>`; };

    <div class="col">${panel('Respondidas hoy', resp.map(s => item(s, false)).join('') || '<p class="muted">Todavía ninguna.</p>')}</div></div>`);

/* ---------- Administración: domiciliarios ---------- */
const semanaDe = id => D.servicios.filter(s => s.domi === id && s.estado === 'entregado' && s.tiempos.entregado >= lunes(0).getTime());
STP.a_domis = () => {
  const q = norm(S.busca);
  let lista = D.domis.filter(d => (S.puntoF === 'todos' || d.punto === S.puntoF) && (!q || norm(`${d.nombre} ${d.movil} ${d.tel}`).includes(q)));
  lista = [...lista].sort((a, c) => a.punto.localeCompare(c.punto) || a.movil - c.movil);
  if (!S.domiSel || !domi(S.domiSel)) S.domiSel = 'carlos';
  const filas = lista.map(d => `<tr class="${d.id === S.domiSel ? 'f-sel' : ''}"><td><button class="b-nombre" data-accion="st-domi" data-id="${d.id}" aria-label="Editar a Móvil ${d.movil} · ${esc(d.nombre)}">${doble(`Móvil ${d.movil} · ${esc(d.nombre)}`, `${esc(punto(d.punto).corto)} · ${telFmt(d.tel)}`)}</button></td><td>${CUOTA_PILL(d)}</td><td>${ahoraDomi(d)}</td><td class="der">${semanaDe(d.id).length}</td></tr>`);
  const busc = `<div class="busca">${ic('search', 18, 2.2)}<input id="f-busca" data-s="busca" value="${esc(S.busca)}" placeholder="Buscar por nombre, móvil o celular" aria-label="Buscar por nombre, móvil o celular"></div>`;
  const selP = `<label class="sr-only" for="f-puntoF2">Filtrar por punto</label><select id="f-puntoF2" class="sel-st" data-accion-change="punto-f"><option value="todos">Todos los puntos</option>${D.puntos.map(p => `<option value="${p.id}" ${S.puntoF === p.id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select>`;
  const izq = panel('', `<div class="fila-b">${busc}${selP}</div>` + (filas.length ? tabla([['Domiciliario'], ['Cuota'], ['Ahora'], ['Semana', 'der']], filas, 540) : '<p class="muted">Nadie coincide con la búsqueda.</p>')
    + `<small class="muted">Toca un nombre para editarlo. Semana = servicios entregados desde el lunes.</small>`);
  const d = domi(S.domiSel);
  if (!S.domiForm || S.domiForm.id !== d.id) S.domiForm = { id: d.id, movil: String(d.movil), punto: d.punto, tel: telFmt(d.tel), placa: d.placa, moto: d.moto, estado: d.bloqueo === 'admin' ? 'bloqueado' : 'activo' };
  const DF = S.domiForm, sem = semanaDe(d.id);
  const prom = sem.length ? Math.round(sem.reduce((a, s) => a + (s.tiempos.entregado - s.tiempos.aceptado), 0) / sem.length / 60000) : 0;
  const acep = sem.length ? Math.round(sem.reduce((a, s) => a + (s.aceptoEn || 0), 0) / sem.length) : 0;
  const noAc = D.servicios.filter(s => (s.noAcepto || []).includes(d.id) && s.tiempos.registrado >= lunes(0).getTime()).length;
  const inp = (k, et, opts = {}) => `<div class="f ${opts.ancho || ''}"><label for="df-${k}">${et}</label><div class="in"><input id="df-${k}" data-df="${k}" value="${esc(DF[k])}" ${opts.num ? 'inputmode="numeric"' : ''}></div></div>`;
  const ficha = panel('', `<div class="fila-ico" style="align-items:center">${avatar(d, 'grande')}${doble(esc(d.nombre), `${CUOTA_TXT_ST(d)} · desde ${esc(d.desde || 'enero')}`)}</div>
    <div class="f-grid">${inp('movil', 'Número de móvil', { num: true, ancho: 'angosto' })}<div class="f"><label for="df-punto">Punto asignado</label><select id="df-punto" data-df="punto">${D.puntos.map(p => `<option value="${p.id}" ${DF.punto === p.id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select></div></div>
    <div class="aviso-st ambar">${ic('info', 17, 2.2)}<span>Si le cambias el punto, sale del turno actual y entra de último en el del nuevo punto.</span></div>
    <div class="f-grid">${inp('tel', 'Celular', { num: true })}${inp('placa', 'Placa', { ancho: 'angosto' })}</div>
    <div class="f-grid">${inp('moto', 'Moto', { ancho: 'ancho-total' })}</div>
    <div class="f"><span class="f-lbl" id="lbl-est">Estado de la cuenta</span><div class="seg" role="group" aria-labelledby="lbl-est">
      <button data-accion="df-estado" data-v="activo" aria-pressed="${DF.estado === 'activo'}" class="${DF.estado === 'activo' ? 'sel' : ''}">Activo</button>
      <button data-accion="df-estado" data-v="bloqueado" aria-pressed="${DF.estado === 'bloqueado'}" class="${DF.estado === 'bloqueado' ? 'sel rojo' : ''}">Bloqueado</button></div></div>
    <div class="mini-stats"><div><small>Servicios esta semana</small><b>${sem.length}</b></div><div><small>Acepta en promedio</small><b>${acep ? acep + ' s' : '—'}</b></div><div><small>Entrega promedio</small><b>${prom ? prom + ' min' : '—'}</b></div><div><small>No aceptó a tiempo</small><b>${plural(noAc, 'vez', 'veces')}</b></div></div>
    <div class="fila-b">${b('Guardar cambios', 'st-guardar-domi', 'pri', 'check')}${b('Restablecer clave', 'st-clave', 'sec')}</div>`);
  const head = stHeader('Domiciliarios', `${D.domis.length} registrados · ${D.domis.filter(x => !x.bloqueo).length} activos · ${D.domis.filter(x => x.bloqueo).length} bloqueados. Aquí se les asigna el móvil y el punto.`, b('Nuevo domiciliario', 'st-nuevo-domi', 'pri', 'plus'));
  return stLayout('a_domis', head + `<div class="dos">${izq}<div class="col">${ficha}</div></div>`);
};
const CUOTA_TXT_ST = d => ({ al_dia: 'Cuota al día', pendiente: 'Cuota pendiente', revision: 'Cuota en revisión', vencida: 'Cuota vencida' }[d.cuota]);

/* ---------- Administración: cuotas ---------- */
STP.a_cuotas = () => {
  const ds = D.domis, cnt = k => ds.filter(d => d.cuota === k).length;
  const k = `<div class="kpis">${kpi('Pagaron', `${cnt('al_dia')} de ${ds.length}`, `$${esc(cfg().valorCuota)} cada uno`, 'verde', 'check')}${kpi('En revisión', cnt('revision'), 'Subieron comprobante', 'ambar', 'clock')}${kpi('Pendientes', cnt('pendiente'), `Se bloquean el ${esc(cfg().diaPago.toLowerCase())}`, 'naranja', 'wallet')}${kpi('Bloqueados', ds.filter(d => d.bloqueo === 'cuota').length, 'Fuera del turno', 'rojo', 'lock')}</div>`;
  const orden = { revision: 0, pendiente: 1, vencida: 2, al_dia: 3 };

  const lista = ds.filter(d => f === 'todos' || d.cuota === f).sort((a, c) => orden[a.cuota] - orden[c.cuota] || a.movil - c.movil);
  if (!S.cuotaSel || !domi(S.cuotaSel)) S.cuotaSel = (ds.find(d => d.cuota === 'revision') || {}).id || null;

    : d.cuota === 'al_dia' ? doble(esc((d.pagos && d.pagos[0] && d.pagos[0].medio) || 'Nequi'), d.pagos && d.pagos[0] ? hace(d.pagos[0].ts) : 'lun ' + lunes(0).getDate(), false)
    : d.cuota === 'vencida' ? doble(`Debe ${plural(d.debe || 1, 'semana', 'semanas')}`, d.rechazo ? 'Le rechazaron el comprobante' : 'Sin pago', false) : `<span class="muted">${d.rechazo ? 'Comprobante rechazado' : 'Sin pago'}</span>`;
  const acc = d => d.cuota === 'revision' ? b('Revisar', 'st-cuota', 'suave chico', 'image', `data-id="${d.id}"`) : d.cuota !== 'al_dia' ? b('Registrar', 'st-registrar', 'suave chico', 'cash', `data-id="${d.id}" aria-label="Registrar pago de Móvil ${d.movil}"`) : '';
  const filas = lista.map(d => `<tr class="${d.id === S.cuotaSel ? 'f-sel' : ''}"><td>${doble(`Móvil ${d.movil} · ${esc(d.nombre)}`, `${esc(punto(d.punto).corto)} · ${telFmt(d.tel)}`)}</td><td>${CUOTA_PILL(d)}</td><td>${pago(d)}</td><td class="der">${acc(d)}</td></tr>`);
  const ops = [['todos', 'Todos', ds.length], ['revision', 'En revisión', cnt('revision')], ['pendiente', 'Pendientes', cnt('pendiente')], ['vencida', 'Vencidas', cnt('vencida')], ['al_dia', 'Pagaron', cnt('al_dia')]];
  const izq = panel('Domiciliarios', filtrosChips(ops, f, 'filtro-q') + (filas.length ? tabla([['Domiciliario'], ['Estado'], ['Pago'], [OCULTO('Acción'), 'der']], filas, 560) : '<p class="muted">Nadie en este filtro.</p>'), '<small class="muted">Primero los que necesitan algo</small>');
  const sel = S.cuotaSel ? domi(S.cuotaSel) : null;
  let comp = '';
  if (sel && sel.cuota === 'revision') {
    const c = sel.comprobante || {};
    comp = panel('Comprobante', `${doble(`Móvil ${sel.movil} · ${esc(sel.nombre)}`, `${esc(punto(sel.punto).nombre)} · semana ${rangoSemana(0)}`)}
      ${c.foto ? `<img class="comp-foto" src="${c.foto}" alt="Comprobante de ${esc(sel.nombre)}">` : `<div class="comp-vacio">${ic('image', 40, 1.8)}<b>Foto del comprobante</b><small>${esc(sel.corto)} lo envió sin foto en esta prueba</small></div>`}
      <div><div class="kv-st"><span>Medio</span><b>${esc(c.medio || '—')}</b></div><div class="kv-st"><span>Valor que reportó</span><b>${esc(c.valor ? (String(c.valor).startsWith('$') ? c.valor : '$' + c.valor) : '$' + cfg().valorCuota)}</b></div><div class="kv-st"><span>Lo envió</span><b>${c.ts ? hace(c.ts) : '—'}</b></div><div class="kv-st"><span>Semanas que debe</span><b>${sel.debe || (sel.bloqueo ? 1 : 0)}</b></div></div>
      ${sel.bloqueo === 'cuota' ? `<div class="aviso-st verde">${ic('check', 17, 2.2)}<span>Al aprobar, ${esc(sel.corto)} vuelve al turno de ${esc(punto(sel.punto).corto)} y entra de último.</span></div>` : ''}
