/* ---------- Administración: reportes ---------- */
function periodoServicios() {
  const desde = S.periodo === 'hoy' ? new Date(new Date().setHours(0, 0, 0, 0)).getTime() : lunes(0).getTime();
  return D.servicios.filter(s => yaTermino(s) && tFin(s) >= desde);
}
STP.a_reportes = () => {
  const L = periodoServicios(), ok = L.filter(s => s.estado === 'entregado'), can = L.filter(s => s.estado === 'cancelado');
  const avg = (arr, fn) => arr.length ? arr.reduce((a, s) => a + fn(s), 0) / arr.length : 0;
  const entProm = Math.round(avg(ok, s => (s.tiempos.entregado - s.tiempos.aceptado) / 60000));
  const acep = Math.round(avg(L.filter(s => s.aceptoEn), s => s.aceptoEn));
  const k = `<div class="kpis">${kpi('Servicios', ok.length, `${ok.filter(s => s.tipo === 'domicilio').length} domicilios · ${ok.filter(s => s.tipo === 'mototaxi').length} mototaxi`, 'neutro', 'moto')}${kpi('Entrega promedio', entProm ? entProm + ' min' : '—', 'Desde que acepta hasta entregar', 'neutro', 'clock')}${kpi('Aceptan en', acep ? acep + ' s' : '—', `En promedio, de ${cfg().seg} s`, 'azul', 'check')}${kpi('Cancelados', can.length, L.length ? `${(can.length / L.length * 100).toFixed(1).replace('.', ',')} % del total` : '', 'rojo', 'x')}</div>`;
  // Gráfica: por día (semana) o por hora (hoy)
  let barras, titulo, nota;
  if (S.periodo === 'hoy') {
    const horas = []; for (let h = 7; h <= 21; h++) horas.push([h === 12 ? '12 m' : (h > 12 ? h - 12 : h) + (h < 12 ? ' a' : ' p'), ok.filter(s => new Date(s.tiempos.entregado).getHours() === h).length, h === new Date().getHours()]);
    barras = horas; titulo = 'Servicios por hora (hoy)'; nota = 'Entregados en cada hora del día.';
  } else {
    const dias = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'], hoyI = (new Date().getDay() + 6) % 7;
    barras = dias.map((dd, i) => [dd + (i === hoyI ? ' · hoy' : ''), i > hoyI ? null : ok.filter(s => (new Date(s.tiempos.entregado).getDay() + 6) % 7 === i).length, i === hoyI]);
    titulo = 'Servicios por día'; nota = 'El día de hoy va hasta ahora. Pasa el cursor por una barra para ver el número.';
  }
  const max = Math.max(10, ...barras.map(x => x[1] || 0)), tope = Math.ceil(max / 20) * 20;
  const grid = [0, .25, .5, .75, 1].map(f => `<div class="g-linea" style="bottom:${f * 100}%"><span>${Math.round(tope * f)}</span></div>`).join('');
  const cols = barras.map(([et, v, hoy]) => `<div class="g-col" ${v != null ? `title="${et.replace(' · hoy', '')}: ${v} servicios"` : ''}>${v == null ? '<small class="muted">—</small>' : `${hoy ? `<b>${v}</b>` : ''}<i style="height:${v / tope * 100}%"></i>`}</div>`).join('');
  const etqs = barras.map(([et, , hoy]) => `<span class="${hoy ? 'hoy' : ''}">${et}</span>`).join('');
  const grafica = panel(titulo, `<figure class="grafica"><div class="g-area" role="img" aria-label="${titulo}: ${barras.filter(x => x[1] != null).map(x => `${x[0]} ${x[1]}`).join(', ')}">${grid}<div class="g-cols">${cols}</div></div><div class="g-etq">${etqs}</div><figcaption>${nota}</figcaption></figure>`, '<small class="muted">Domicilios y mototaxi juntos</small>');
  // Por domiciliario
  const porD = D.domis.map(d => { const mios = ok.filter(s => s.domi === d.id); return { d, n: mios.length, ent: Math.round(avg(mios, s => (s.tiempos.entregado - s.tiempos.aceptado) / 60000)), ac: Math.round(avg(mios, s => s.aceptoEn || 0)), na: L.filter(s => (s.noAcepto || []).includes(d.id)).length, ca: can.filter(s => s.domi === d.id).length }; }).filter(x => x.n || x.ca).sort((a, c) => c.n - a.n).slice(0, 8);
  const tablaD = porD.length ? tabla([['Domiciliario'], ['Servicios', 'der'], ['Entrega', 'der'], ['Acepta en', 'der'], ['No aceptó a tiempo', 'der'], ['Cancelados', 'der']], porD.map(x => `<tr><td><b class="nw">${esc(nomMovil(x.d))}</b></td><td class="der">${x.n}</td><td class="der">${x.ent ? x.ent + ' min' : '—'}</td><td class="der">${x.ac ? x.ac + ' s' : '—'}</td><td class="der">${x.na}</td><td class="der">${x.ca}</td></tr>`), 600) : '<p class="muted">Sin servicios en este periodo.</p>';
  const porDomi = panel('Por domiciliario', tablaD, '<button class="b-link" data-accion="ir" data-a="a_domis">Ver todos' + ic('chev', 16, 2.4) + '</button>');
  // Por punto
  const pp = D.puntos.map(p => ({ p, n: ok.filter(s => s.punto === p.id).length, ent: Math.round(avg(ok.filter(s => s.punto === p.id), s => (s.tiempos.entregado - s.tiempos.aceptado) / 60000)) }));
  const maxP = Math.max(1, ...pp.map(x => x.n));
  const porPunto = panel('Por punto', pp.map(x => `<div class="barra-p"><div class="kv-st"><b>${esc(x.p.nombre)}</b><b>${x.n}</b></div><span class="bp"><i style="width:${x.n / maxP * 100}%"></i></span><small class="muted">Entrega promedio ${x.ent ? x.ent + ' min' : '—'}</small></div>`).join(''));
  const turno = panel('Cómo funcionó el turno', `<div class="kv-st"><span>Pasaron al siguiente por no aceptar a tiempo</span><b>${L.reduce((a, s) => a + (s.noAcepto || []).length, 0)}</b></div><div class="kv-st"><span>Veces que se saltó a alguien por estar fuera</span><b>${L.reduce((a, s) => a + (s.saltos || 0), 0)}</b></div><div class="kv-st"><span>Servicios que quedaron sin móvil</span><b>${L.filter(s => s.fueSinMovil).length}</b></div><div class="kv-st"><span>Reasignados a otro punto</span><b>${L.filter(s => s.reasignado).length}</b></div>`);
  const mot = {}; can.forEach(s => { const m = s.cancel.motivo.replace(/ — .*/, ''); mot[m] = (mot[m] || 0) + 1; });
  const motivos = panel('Por qué se cancelaron', Object.entries(mot).sort((a, c) => c[1] - a[1]).map(([m, n]) => `<div class="kv-st"><span>${esc(m)}</span><b>${n}</b></div>`).join('') || '<p class="muted">Ningún cancelado en este periodo.</p>');
  const head = stHeader('Reportes', `${S.periodo === 'hoy' ? 'Hoy · ' + fechaLarga(new Date()) : 'Semana del ' + rangoSemana(0)} · todos los puntos`, filtrosChips([['hoy', 'Hoy'], ['semana', 'Esta semana']], S.periodo, 'periodo') + b('Descargar CSV', 'st-csv', 'sec', 'download'));
  return stLayout('a_reportes', head + k + `<div class="dos">${'<div class="col">' + grafica + porDomi + '</div>'}<div class="col">${porPunto}${turno}${motivos}</div></div>`);
};
function descargarCSV() {
  const L = periodoServicios();
  const c = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const filas = [['Servicio', 'Tipo', 'Punto', 'Llegó por', 'Domiciliario', 'Estado', 'Registrado', 'Aceptado', 'Recogido', 'Terminado', 'Aceptó en (s)', 'Valor', 'Cobrado', 'Pago', 'Motivo cancelación'].join(';')];
  L.forEach(s => { const d = s.domi ? domi(s.domi) : null, t = s.tiempos, fh = x => x ? new Date(x).toLocaleString('es-CO') : '';
    filas.push([s.id, V(s).etiqueta, punto(s.punto).corto, ORIGEN_TXT[s.origen] || '', d ? nomMovil(d) : '', s.estado, fh(t.registrado), fh(t.aceptado), fh(t.recogido), fh(tFin(s)), s.aceptoEn || '', s.valor, s.cobrado || 0, s.pago || '', s.cancel ? s.cancel.motivo : ''].map(c).join(';')); });
  const blob = new Blob(['﻿' + filas.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `tudomiya-servicios-${S.periodo}.csv`; document.body.appendChild(a); a.click(); a.remove();
  toast(`Descargado: ${plural(L.length, 'servicio', 'servicios')} (se abre en Excel)`);
}

function comprimirFoto(file, cb) {
  const lector = new FileReader();
  lector.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      try { cb(c.toDataURL('image/jpeg', 0.6)); } catch (e) { cb(lector.result); }
    };
    img.onerror = () => cb(lector.result);
    img.src = lector.result;
  };
  lector.readAsDataURL(file);
}

      if (!s || !pid) { cerrarSheet(); break; }
      reasignar(s, pid); guardarDatos(); S.sheet = null; render();
      toast(s.estado === 'ofreciendo' ? `Reasignado a ${punto(pid).corto}: se le ofrece a ${nomMovil(domi(s.ofrecidoA))}` : `Reasignado a ${punto(pid).corto}, pero allí tampoco hay nadie en el punto`);
      break;
    }
    case 'st-cancelar': abrirSheet('st_cancelar', { id }); break;
    case 'st-confirmar-cancelar': {
      const s = serv(S.sheetParams.id); if (!s) { cerrarSheet(); break; }
      const dd = s.domi ? domi(s.domi) : null;
      cancelarServicio(s, S.sel.motivo || (s.tipo === 'mototaxi' ? 'El pasajero canceló la carrera' : MOTIVOS_CENTRAL[0]), 'central'); guardarDatos(); S.sheet = null; render();
      toast(dd ? `Cancelado. ${nomMovil(dd)} recibió el aviso y vuelve ${cfg().cancelaCentral === 'primero' ? 'de primero' : 'de último'} al turno.` : 'Servicio cancelado'); break;
    }
    case 'st-novedad': abrirSheet('st_novedad', { id }); break;
    case 'st-confirmar-novedad': {
      const s = serv(S.sheetParams.id); if (!s) { cerrarSheet(); break; }
      const r = S.sel.resp || RESPUESTAS_NOVEDAD[0]; responderNovedad(s, r); guardarDatos(); S.sheet = null; render();
      toast(`Respuesta enviada a ${nomMovil(domi(s.domi))}: ${r}`); break;
    }
    case 'st-opciones': abrirSheet('st_opciones', { id }); break;
    case 'st-presencia': { const x = domi(id); x.enPunto = !x.enPunto; x.vueltaEn = null; guardarDatos(); S.sheet = null; render(); toast(x.enPunto ? `${nomMovil(x)} llegó al punto` : `${nomMovil(x)} salió del punto: se le salta, conserva su lugar`); break; }
    case 'st-sacar': abrirSheet('st_sacar', { id }); break;
    case 'st-confirmar-sacar': { const x = domi(S.sheetParams.id); sacarDelTurno(x.id, S.sel.motivo || MOTIVOS_SACAR[0], staff().nombre); guardarDatos(); S.sheet = null; render(); toast(`${nomMovil(x)} salió del turno. Le llegó el motivo.`); break; }
    case 'st-meter': { const x = domi(id); x.aviso = null; x.conectado = true; meterAlTurno(x.id, false); guardarDatos(); S.sheet = null; render(); toast(`${nomMovil(x)} entró de último al turno (${posEn(x.punto, x.id)}°)`); break; }
    case 'st-domi': S.domiSel = id; S.domiForm = null; render(); break;
    case 'df-estado': S.domiForm.estado = el.dataset.v; render(); break;
    case 'st-guardar-domi': {
      const F = S.domiForm, x = domi(F.id), mv = aNum(F.movil);
      if (!mv) { toast('Escribe un número de móvil válido'); break; }
      if (D.domis.some(o => o.id !== x.id && o.movil === mv)) { toast(`El móvil ${mv} ya lo tiene otro domiciliario`); break; }
      const tel = soloDigitos(F.tel);
      if (tel.length !== 10) { toast('El celular debe tener 10 dígitos'); break; }
      const cambioPunto = F.punto !== x.punto;
      x.movil = mv; x.tel = tel; x.placa = F.placa.trim(); x.moto = F.moto.trim();
      if (cambioPunto) { const estaba = !!posEn(x.punto, x.id); quitarDeFilas(x.id); x.punto = F.punto; if (estaba || (x.conectado && !x.bloqueo && !activoDe(x.id))) meterAlTurno(x.id, false); x.enPunto = false; }
      if (F.estado === 'bloqueado' && x.bloqueo !== 'admin') { x.bloqueo = 'admin'; quitarDeFilas(x.id); }
      if (F.estado === 'activo' && x.bloqueo === 'admin') { x.bloqueo = x.cuota === 'vencida' ? 'cuota' : null; if (!x.bloqueo && x.conectado && !activoDe(x.id)) meterAlTurno(x.id, false); }
      S.domiForm = null;
      hecho(`Guardado: ${nomMovil(x)}${cambioPunto ? ` ahora hace turno en ${punto(x.punto).corto} (entra de último)` : ''}`);
      break;
    }
    case 'st-clave': toast(`Clave restablecida a ${CLAVE} (simulado). Le llega por WhatsApp.`); break;
    case 'st-nuevo-domi': abrirSheet('st_nuevo_domi'); break;
    case 'st-crear-domi': {
      const v = k => (document.querySelector(`[data-nd="${k}"]`).value || '').trim();
      const nombre = v('nombre'), tel = soloDigitos(v('tel')), mv = aNum(v('movil')), err = document.getElementById('err-nd');
      const fallo = !nombre ? 'Escribe el nombre' : tel.length !== 10 ? 'El celular debe tener 10 dígitos' : D.domis.some(o => o.tel === tel) || STAFF[tel] ? 'Ese celular ya está registrado' : !mv ? 'Escribe el número de móvil' : D.domis.some(o => o.movil === mv) ? `El móvil ${mv} ya existe` : '';
      if (fallo) { err.textContent = fallo; err.hidden = false; break; }
      const nid = 'd' + ahora().toString(36);
      D.domis.push({ id: nid, movil: mv, nombre, corto: nombre.split(' ')[0], iniciales: nombre.split(' ').map(x => x[0]).join('').slice(0, 2).toUpperCase(), tel, placa: v('placa') || '—', moto: v('moto') || '—', punto: v('punto'), cuota: 'pendiente', bloqueo: null, enPunto: false, conectado: false, sim: false, permisos: false, debe: 0, comprobante: null, rechazo: null, aviso: null, vueltaEn: null, desde: 'hoy' });
      S.domiSel = nid; S.domiForm = null; S.sheet = null; hecho(`Creado Móvil ${mv} · ${nombre.split(' ')[0]}. Entra con ${telFmt(tel)} y la clave ${CLAVE}.`); break;
    }
    case 'st-cuota': S.cuotaSel = id; render(); break;
    case 'st-aprobar': { const x = domi(id); const bloq = x.bloqueo === 'cuota'; aprobarPago(x); S.cuotaSel = null; hecho(`Pago de ${nomMovil(x)} aprobado${bloq ? `: volvió al turno de ${punto(x.punto).corto} (${posEn(x.punto, x.id) || 'de último'}°)` : ''}.`); break; }
    case 'st-rechazar': abrirSheet('st_rechazar', { id }); break;
    case 'st-confirmar-rechazo': { const x = domi(S.sheetParams.id); rechazarPago(x, S.sel.motivo || MOTIVOS_RECHAZO[0]); S.sheet = null; S.cuotaSel = null; hecho(`Rechazado. ${nomMovil(x)} ve el motivo en la app.`); break; }
    case 'st-registrar': abrirSheet('st_registrar', { id }); break;
    case 'st-confirmar-registro': { const x = domi(S.sheetParams.id); const bloq = x.bloqueo === 'cuota'; aprobarPago(x, S.sel.medio || 'Efectivo en la central'); S.sheet = null; hecho(`Pago registrado: ${nomMovil(x)} al día${bloq ? ' y de vuelta en el turno' : ''}.`); break; }
    case 'st-recordar': { const n = D.domis.filter(x => x.cuota === 'pendiente').length; toast(n ? `Recordatorio enviado por WhatsApp a ${plural(n, 'domiciliario', 'domiciliarios')} (simulado)` : 'No hay pendientes'); break; }
    case 'st-corte': { const n = corteSemana(); hecho(n ? `Corte aplicado: ${plural(n, 'domiciliario quedó', 'domiciliarios quedaron')} ${cfg().bloqueoAuto ? 'bloqueado(s) y fuera del turno' : 'con la cuota vencida'}.` : 'No había pendientes: nadie quedó bloqueado.'); break; }
    case 'st-csv': descargarCSV(); break;
    case 'cf-sw': { S.cfgForm[el.dataset.k] = !S.cfgForm[el.dataset.k]; render(); break; }
    case 'st-guardar-cfg': {
      const F = S.cfgForm, seg = aNum(F.seg), radio = aNum(F.radio);
      if (seg < 10 || seg > 120) { toast('Los segundos para aceptar deben estar entre 10 y 120'); break; }
      Object.assign(D.cfg, F, { seg, radio: radio || 200, valorCuota: String(F.valorCuota).replace(/^\$/, '').trim() || 'XX.000' });
      D.puntos.forEach(p => { p.radio = radio || 200; });
      S.cfgForm = null; hecho('Configuración guardada: ya aplica para todos'); break;
    }
    case 'st-punto-nuevo': abrirSheet('st_punto'); break;
    case 'st-crear-punto': {
      const nombre = document.getElementById('np-nombre').value.trim(), dir = document.getElementById('np-dir').value.trim();
      if (!nombre || !dir) { document.getElementById('err-np').hidden = false; break; }
      D.puntos.push({ id: 'p' + ahora().toString(36), nombre, corto: cortoNegocio(nombre), dir, radio: cfg().radio, fila: [], menu: MENU_GEN });
      S.sheet = null; hecho(`Punto agregado: ${nombre}. Asígnale domiciliarios en Domiciliarios.`); break;
    }
    case 'st-reiniciar': abrirSheet('st_reiniciar'); break;
  }
});

app.addEventListener('submit', e => {
  if (e.target.id !== 'form-login') return;
  e.preventDefault();
  refrescar();
  const tel = soloDigitos(document.getElementById('tel').value);
  const clave = document.getElementById('clave').value.trim();
  const st = STAFF[tel], d = domiPorTel(tel);
  if ((!st && !d) || clave !== CLAVE) { document.getElementById('err-login').hidden = false; return; }
  S = SESION_VACIA(); S.tel = tel;
  if (st) { ir('c_despacho'); toast(`Hola, ${st.corto}`); return; }
  let aviso = '';
  if (!d.bloqueo && d.conectado && !activoDe(d.id) && !posEn(d.punto, d.id)) { meterAlTurno(d.id, false); guardarDatos(); aviso = `Entraste de último al turno de ${punto(d.punto).corto} (${posEn(d.punto, d.id)}°).`; }
  ir(d.permisos ? 'turno' : 'permisos');
  if (aviso) toast(aviso);
});

app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f && S.form) { S.form[t.dataset.f] = t.value; if (S.form.err && S.form.err[t.dataset.f]) { delete S.form.err[t.dataset.f]; const m = t.closest('.f') && t.closest('.f').querySelector('.f-err'); if (m) m.remove(); } }
  if (t.dataset.df && S.domiForm) S.domiForm[t.dataset.df] = t.value;
  if (t.dataset.cf && S.cfgForm) S.cfgForm[t.dataset.cf] = t.value;
  if (t.dataset.s === 'busca') { S.busca = t.value; const pos = t.selectionStart; render(); const n = document.getElementById('f-busca'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
});

app.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f && S.form) {
    S.form[t.dataset.f] = t.value;
    if (t.dataset.f === 'punto') { const p = punto(t.value); if (p) { S.form.negocio = p.nombre; S.form.dirNegocio = p.dir; } }
    if (t.dataset.re || t.dataset.f === 'origen') { t.blur(); render(); }
    return;
  }
  if (t.dataset.df && S.domiForm) { S.domiForm[t.dataset.df] = t.value; return; }
  if (t.dataset.cf && S.cfgForm) { S.cfgForm[t.dataset.cf] = t.value; return; }
  if (t.dataset.accionChange === 'punto-f') { S.puntoF = t.value; t.blur(); render(); return; }
  if (t.id !== 'foto' || !t.files || !t.files[0]) return;
  comprimirFoto(t.files[0], url => {
    S.foto = url;
    const cont = document.getElementById('subir-contenido'); if (cont) cont.innerHTML = contenidoSubir();
    const err = document.getElementById('err-foto'); if (err) err.hidden = true;
  });
});

history.replaceState({ p: S.pantalla, params: S.params }, '');
if (motor()) guardarDatos();
render();
</script>
</body>
</html>
