<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC400">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TuDomiYa">
<title>TuDomiYa · App del domiciliario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --amarillo:#FFC400; --fondo:#FFF7ED; --borde:#FED7AA; --suave:#FFEDD5; --amarillo-suave:#FEF3C7;
  --nuevo:#FB923C; --accion:#EA580C; --naranja:#C2410C;
  --texto:#44403C; --texto-fuerte:#1C1917; --texto-suave:#57534E; --gris:#78716C; --gris-claro:#F5F5F4; --linea:#E7E5E4;
  --verde:#15803D; --verde-suave:#DCFCE7; --verde-texto:#166534;
  --azul:#2563EB; --azul-texto:#1D4ED8; --azul-suave:#DBEAFE; --azul-linea:#93C5FD;
  --morado:#7E22CE; --morado-fuerte:#6B21A8; --morado-suave:#F3E8FF;
  --rojo:#DC2626; --rojo-texto:#B91C1C; --rojo-suave:#FEE2E2;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E7E5E4;font-family:'Outfit',system-ui,-apple-system,sans-serif;color:var(--texto);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
.app{max-width:430px;margin:0 auto;background:var(--fondo);min-height:100vh;min-height:100dvh}
.pantalla{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.contenido{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
.grow{flex:1}
.centro{text-align:center}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Encabezados */
.header{background:var(--amarillo);padding:calc(16px + env(safe-area-inset-top)) 20px 22px;border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:16px}
.header-fila{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca-wrap{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--naranja);color:var(--amarillo);display:flex;align-items:center;justify-content:center;border:none;padding:0;flex-shrink:0;cursor:pointer}
.marca{font-weight:800;font-size:26px;letter-spacing:-.5px;color:var(--naranja)}
.icon-btn{width:48px;height:48px;border-radius:16px;border:none;background:var(--naranja);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex-shrink:0}
.saludo-fila{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.saludo-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.saludo{font-size:32px;font-weight:800;letter-spacing:-.5px;line-height:1.1;color:var(--texto-fuerte)}
.estado{font-size:16px;font-weight:600;color:var(--texto)}
.chip-ubic{align-self:flex-start;max-width:100%;height:38px;display:inline-flex;align-items:center;gap:6px;border:none;border-radius:999px;padding:0 12px;background:#fff;color:var(--naranja);font-size:15px;font-weight:700;cursor:pointer}
.chip-ubic span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-ubic svg{flex-shrink:0}
.chip-ubic.on{background:var(--naranja);color:#fff}
.switch{flex-shrink:0;width:72px;height:44px;border-radius:22px;border:none;padding:4px;display:flex;align-items:center;justify-content:flex-start;cursor:pointer;background:var(--texto-suave);transition:background .2s}
.switch span{width:36px;height:36px;border-radius:50%;background:#fff;display:block}
.switch.on{background:var(--verde);justify-content:flex-end}
.switch.mini{width:60px;height:36px;border-radius:18px;padding:3px}
.switch.mini span{width:30px;height:30px}
.h-titulo{margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--texto-fuerte)}
.pasos{display:flex;gap:6px}
.pasos span{flex:1;height:8px;border-radius:4px;background:#fff}
.pasos span.lleno{background:var(--naranja)}
.sub-header{background:var(--amarillo);padding:calc(14px + env(safe-area-inset-top)) 16px 18px;border-radius:0 0 28px 28px;display:flex;align-items:center;gap:12px}
.sub-header h1{margin:0;font-size:24px;font-weight:800;color:var(--texto-fuerte)}
.back{width:48px;height:48px;border-radius:16px;background:#fff;color:var(--naranja);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.hero{background:var(--amarillo);padding:calc(44px + env(safe-area-inset-top)) 24px 30px;border-radius:0 0 36px 36px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.hero.rojo{background:var(--rojo-suave)}
.hero h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.5px;color:var(--texto-fuerte)}
.hero p{margin:0;font-size:16px}
.logo-grande{width:88px;height:88px;border-radius:26px;background:var(--naranja);color:var(--amarillo);display:flex;align-items:center;justify-content:center}
.circ-grande{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}

/* Secciones y tarjetas */
.seccion{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 0}
.seccion h2{margin:0;font-size:22px;font-weight:700;color:var(--naranja)}
.contador{min-width:32px;height:30px;border-radius:15px;background:var(--naranja);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0 10px}
.card{background:#fff;border:1px solid var(--borde);border-radius:24px;overflow:hidden}
.card-pad{padding:18px;display:flex;flex-direction:column;gap:14px}
.card-borde{border:1px solid var(--borde);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:#fff}
.strip{padding:10px 16px 10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:15px;color:var(--texto)}
.strip.nuevo{background:var(--nuevo)}
.strip.normal{background:var(--amarillo-suave)}
.strip.bloq{background:var(--gris-claro);color:var(--texto-suave)}
.strip .t{display:inline-flex;align-items:center;gap:6px}
.chip-tipo{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:4px 11px 4px 9px;border-radius:999px;white-space:nowrap}
.chip-tipo.dom{background:var(--suave);color:var(--naranja)}
.chip-tipo.dom.blanco{background:#fff}
.chip-tipo.moto{background:var(--naranja);color:#fff}
.chip-tipo.gris{background:var(--linea);color:var(--texto-suave)}
.chip-tipo.peq{font-size:12px;padding:3px 8px;gap:4px;border-radius:8px}
.paradas{display:flex;flex-direction:column}
.parada{display:flex;gap:14px;position:relative;padding-bottom:14px}
.parada:last-child{padding-bottom:0}
.parada .dot{width:14px;height:14px;border-radius:50%;margin-top:3px;flex-shrink:0;position:relative;z-index:1}
.parada.recoger .dot{background:var(--azul)}
.parada.entregar .dot{border:3px solid var(--accion);background:#fff}
.parada.recoger::before{content:'';position:absolute;left:6px;top:21px;bottom:0;border-left:2px dashed var(--azul-linea)}
.parada-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.lbl{font-size:13px;font-weight:700}
.lbl.azul{color:var(--azul-texto)} .lbl.naranja{color:var(--naranja)} .lbl.rojo{color:var(--rojo-texto)}
.nombre{font-size:18px;font-weight:700;color:var(--texto-fuerte)}
.grande-nombre{font-size:22px;font-weight:800;color:var(--texto-fuerte)}
.dir{font-size:15px;color:var(--texto-suave)}
.mini-paradas{display:flex;flex-direction:column;gap:8px}
.mini-paradas > div{display:flex;align-items:flex-start;gap:10px}
.mini-paradas .dot-azul,.mini-paradas .dot-naranja{margin-top:5px}
.mini-paradas .t{display:flex;flex-direction:column}
.mini-paradas b{font-size:16px;color:var(--texto-fuerte)}
.mini-paradas small{font-size:14px;color:var(--texto-suave)}
.resumen{display:flex;align-items:center;gap:8px;background:var(--fondo);border-radius:14px;padding:0 2px 0 12px;min-height:46px}
.resumen > svg{flex-shrink:0;color:var(--naranja)}
.resumen > span{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resumen button{height:42px;padding:0 10px;border:none;background:none;color:var(--naranja);font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:2px;cursor:pointer;flex-shrink:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;padding:7px 12px;border-radius:12px}
.chip.azul{background:var(--azul-suave);color:var(--azul-texto)}
.chip.morado{background:var(--morado-suave);color:var(--morado)}
.chip.gris{background:var(--gris-claro);color:var(--texto-suave)}
.chip.amarillo{background:var(--amarillo);color:var(--texto-fuerte)}
.accion-fila{display:flex;gap:10px;align-items:stretch}
.precio{height:60px;padding:6px 16px;border-radius:18px;background:var(--amarillo);display:flex;flex-direction:column;justify-content:center;flex-shrink:0}
.precio small{font-size:12px;font-weight:700;color:var(--texto)}
.precio b{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.05;color:var(--texto-fuerte)}
.fila-ico{display:flex;gap:14px;align-items:flex-start}
.ico-circ{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico-circ.azul{background:var(--azul-suave);color:var(--azul-texto)}
.ico-circ.naranja{background:var(--suave);color:var(--naranja)}
.ico-circ.morado{background:var(--morado-suave);color:var(--morado)}
.ico-circ.amarillo{background:var(--amarillo-suave);color:var(--naranja)}
.nota-cliente{background:var(--fondo);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;font-size:15px}
.nota-cliente svg{flex-shrink:0;margin-top:1px}
.tiempos-mini{display:flex;gap:16px;justify-content:center;align-items:center;font-size:14px;color:var(--texto-suave);flex-wrap:wrap}
.tiempos-mini span{display:inline-flex;align-items:center;gap:6px}
.morado-box{background:var(--morado-suave);border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.morado-box .circ{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--morado);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.morado-box small{font-size:14px;color:var(--morado);font-weight:700;display:block}
.morado-box b{font-size:32px;font-weight:800;letter-spacing:-.5px;line-height:1.1;color:var(--morado-fuerte);display:block}
.morado-box span.s{font-size:14px;color:var(--morado)}
.morado-fila{background:var(--morado-suave);border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.morado-fila span{font-size:15px;font-weight:700;color:var(--morado)}
.morado-fila b{font-size:26px;font-weight:800;color:var(--morado-fuerte)}
.activo-card{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:22px;background:#fff;border:2px solid var(--accion);text-align:left;width:100%;cursor:pointer;color:var(--texto)}
.item-fila{display:flex;align-items:center;gap:12px;font-size:16px;color:var(--texto-fuerte)}
.cant{width:30px;height:30px;border-radius:9px;background:var(--amarillo-suave);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Modo punto */
.turno-fila{display:flex;align-items:center;gap:14px}
.turno-num{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1;color:var(--texto-fuerte)}
.fila-chips{display:flex;gap:6px;flex-wrap:wrap}
.fila-chips span{background:var(--gris-claro);color:var(--texto-suave);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700}
.fila-chips span.yo{background:var(--accion);color:#fff}
.toggle-card{display:flex;align-items:center;gap:12px;padding:12px 14px}
.solo-punto{font-size:15px;color:var(--texto-suave);padding:0 4px}
.banner-volver{background:#fff;border:2px dashed var(--nuevo);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.banner-volver .fila-top{display:flex;align-items:flex-start;gap:12px}
.cerrar-x{width:40px;height:40px;border-radius:12px;border:none;background:var(--gris-claro);color:var(--texto-suave);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-left:auto}
.buscador{height:52px;border:1.5px solid var(--borde);border-radius:16px;background:var(--fondo);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--naranja);flex-shrink:0}
.buscador:focus-within{border-color:var(--accion);box-shadow:0 0 0 3px rgba(234,88,12,.15)}
.buscador input{flex:1;min-width:0;height:100%;border:none;outline:none;background:transparent;font-size:16px;color:var(--texto-fuerte)}
.lista-puntos{display:flex;flex-direction:column;gap:10px}
.etq-mini{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--texto-suave)}
.destacado{border:2px solid var(--accion);background:var(--fondo);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.punto-fila{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--suave)}
.punto-fila:last-child{border-bottom:none}
.punto-fila b{font-size:16px;color:var(--texto-fuerte)}
.punto-fila b.apagado{color:var(--texto-suave)}
.punto-fila small{font-size:13px;color:var(--texto-suave)}
.mini-btn{height:40px;padding:0 14px;border-radius:12px;border:none;background:var(--suave);color:var(--naranja);font-size:15px;font-weight:700;cursor:pointer;flex-shrink:0}
.lejos{font-size:13px;font-weight:600;color:var(--gris);flex-shrink:0}
mark{background:var(--amarillo-suave);color:inherit;border-radius:3px}

/* Botones */
.btn{height:60px;border-radius:18px;border:none;background:var(--accion);color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;cursor:pointer;width:100%;flex-shrink:0}
.accion-fila .btn{width:auto;flex:1}
.btn.grande{height:64px}
.btn.sec{background:#fff;border:2px solid var(--borde);color:var(--naranja);font-size:17px;height:56px}
.btn.rojo{background:var(--rojo)}
.btn.gris{background:var(--texto-suave)}
.btn.doble{flex-direction:column;gap:0;height:auto;min-height:60px;padding:6px 12px}
.btn.doble small{font-size:13px;color:var(--texto-suave);font-weight:500}
.btn.salir{background:#fff;border:2px solid #FECACA;color:var(--rojo);font-size:18px;height:56px}
.btn-texto{height:48px;border:none;background:none;color:var(--naranja);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;width:100%;flex-shrink:0}
.btn-texto.rojo{color:var(--rojo)}
.btn-texto.chico{height:36px;width:auto;font-size:15px;padding:0 4px}
.bloqueado{height:56px;border-radius:18px;background:var(--gris-claro);color:var(--texto-suave);display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700}
.btn:active,.btn-texto:active,.opcion:active,.fila:active,.menu-fila:active,.activo-card:active,.mini-btn:active,.chip-ubic:active{transform:scale(.98)}
.duo{display:flex;gap:10px}
.duo > *{flex:1}
.mini{height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700;text-decoration:none;border:none;cursor:pointer}
.mini.azul{background:var(--azul-suave);color:var(--azul-texto)}
.mini.naranja{background:var(--suave);color:var(--naranja)}

/* Menú inferior */
.nav-wrap{position:sticky;bottom:0;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:var(--fondo);z-index:5}
.nav{padding:6px;background:var(--naranja);border-radius:24px;display:flex;gap:4px}
.nav button{flex:1;height:56px;border:none;border-radius:18px;background:none;color:var(--suave);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;cursor:pointer;position:relative}
.nav button.activo{background:var(--amarillo);color:var(--texto)}
.nav .punto{position:absolute;top:7px;left:calc(50% + 7px);width:11px;height:11px;border-radius:50%;background:var(--amarillo);border:2px solid var(--naranja)}
.nav .punto.blanco{background:#fff}

/* Avisos y estados */
.aviso{border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:15px}
.aviso svg{flex-shrink:0}
.aviso b{display:block;font-size:16px}
.aviso p{margin:2px 0 0;font-size:14px;color:var(--texto-suave)}
.aviso.naranja{background:var(--suave);border:1px solid var(--borde);color:var(--naranja)}
.aviso.amarillo{background:var(--amarillo-suave);color:var(--texto)}
.aviso.rojo{background:var(--rojo-suave);color:var(--rojo-texto)}
.aviso.rojo p{color:var(--rojo-texto)}
.aviso.apartado{align-items:center;padding:10px 14px}
.aviso.apartado b{font-size:17px;font-weight:800;color:var(--naranja);display:inline}
.vacio{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 12px;text-align:center}
.vacio .circulo{width:108px;height:108px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.vacio h2{margin:0;font-size:24px;font-weight:800;color:var(--texto-fuerte)}
.vacio p{margin:0;font-size:16px;color:var(--texto-suave);max-width:300px}
.vacio .btn,.vacio .monto-card{align-self:stretch}
.circ-amarillo{background:var(--amarillo-suave);color:var(--naranja)}
.circ-rojo{background:var(--rojo-suave);color:var(--rojo)}
.circ-gris{background:var(--gris-claro);color:var(--texto-suave)}
.monto-card{background:#fff;border:1px solid var(--borde);border-radius:18px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;text-align:left}
.monto-card small{display:block;font-size:14px;color:var(--texto-suave)}
.monto-card b{font-size:22px;font-weight:800;color:var(--texto-fuerte)}
.desc-roja{font-size:14px;font-weight:700;color:var(--rojo)}
.pill-verde{align-self:center;display:inline-flex;align-items:center;gap:8px;background:var(--verde-suave);color:var(--verde-texto);font-size:15px;font-weight:700;padding:8px 14px;border-radius:999px}
.pill-verde i{width:10px;height:10px;border-radius:50%;background:var(--verde);display:block}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.badge.gris{background:var(--gris-claro);color:var(--texto-suave)}
.badge.rojo{background:var(--rojo-suave);color:var(--rojo-texto)}
.badge.amarillo{background:var(--amarillo-suave);color:var(--texto)}
.badge.verde{background:var(--verde-suave);color:var(--verde-texto)}
.badge.naranja{background:var(--suave);color:var(--naranja)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.dot-azul{width:12px;height:12px;border-radius:50%;background:var(--azul);flex-shrink:0;display:block}
.dot-naranja{width:12px;height:12px;border-radius:50%;border:3px solid var(--accion);flex-shrink:0;display:block}

/* Formularios */
.opciones{display:flex;flex-direction:column;gap:8px}
.opcion{min-height:54px;border-radius:16px;border:1.5px solid var(--linea);background:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;text-align:left;color:var(--texto-fuerte);font-size:16px;font-weight:600;cursor:pointer;width:100%}
.opcion .radio{width:22px;height:22px;border-radius:50%;border:2px solid #D6D3D1;flex-shrink:0;background:#fff}
.opcion.sel{border:2px solid var(--accion);background:var(--fondo);font-weight:700}
.opcion.sel .radio{border:6px solid var(--accion)}
.opcion .check{color:var(--verde);display:none}
.opcion.sel .check{display:flex}

  <header class="hero" style="padding-top:calc(52px + env(safe-area-inset-top));padding-bottom:36px">
    <div class="logo-grande">${ic('moto', 52)}</div>
    <span style="font-weight:800;font-size:38px;letter-spacing:-1px;color:var(--naranja)">TuDomiYa</span>
    <span style="font-size:17px;font-weight:600">La app de los domiciliarios</span>
  </header>
  <main class="contenido" style="padding:28px 24px 24px;gap:16px">
    <h1 style="margin:0;font-size:26px;font-weight:800;color:var(--texto-fuerte)">Ingresa a tu cuenta</h1>
    <form id="form-login" style="display:flex;flex-direction:column;gap:16px" novalidate>
      <div class="campo"><label for="tel">Número de celular</label><div class="tel"><span>+57</span><input id="tel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="300 123 4567"></div></div>
      <div class="campo"><label for="clave">Clave</label><input class="input" id="clave" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Tu clave"></div>
      <p class="error" id="err-login" hidden>Número o clave incorrectos.</p>
      <button class="btn" type="submit">Ingresar</button>
    </form>
    <div class="cred"><b>Usuarios de prueba · clave 1234</b>
      <button data-accion="llenar" data-tel="3001234567"><span>Carlos · 300 123 4567</span><small>Activo · cuota al día</small></button>
      <button data-accion="llenar" data-tel="3009876543"><span>Luis · 300 987 6543</span><small>Inactivo · cuota vencida</small></button>
    </div>
    <p class="centro" style="margin:0;font-size:13px;color:var(--texto-suave)">Al ingresar aceptas la política de tratamiento de datos.</p>
  </main></div>`;

PANTALLAS.permisos = () => `<div class="pantalla">
  <header class="header" style="padding-bottom:22px"><div class="header-fila"><div class="marca-wrap"><div class="logo" aria-hidden="true">${ic('moto', 27, 2.2)}</div><span class="marca">TuDomiYa</span></div></div></header>
  <main class="contenido" style="padding:28px 20px 24px;gap:16px">
    <h1 class="h-titulo">Antes de empezar</h1>
    <p style="margin:0;font-size:16px;color:var(--texto-suave)">Activa estos permisos para que la app funcione bien en tus recorridos.</p>
    <div class="card"><div class="card-pad" style="flex-direction:row;align-items:flex-start"><span class="ico-circ naranja">${ic('bell', 26)}</span><div class="parada-txt" style="gap:4px"><span class="nombre">Notificaciones</span><span class="dir">Te avisamos al instante cuando llegue un pedido o te toque el turno.</span></div></div></div>
    <div class="card"><div class="card-pad" style="flex-direction:row;align-items:flex-start"><span class="ico-circ azul">${ic('pin', 26)}</span><div class="parada-txt" style="gap:4px"><span class="nombre">Ubicación</span><span class="dir">Para mostrarte el punto más cercano y la distancia a cada pedido.</span></div></div></div>
    <div class="aviso amarillo">${ic('info')}<span>En iPhone, primero agrega TuDomiYa a tu pantalla de inicio para recibir los avisos.</span></div>
    <div class="grow"></div>
    <button class="btn" data-accion="permisos">Activar permisos</button>
    <button class="btn-texto" data-accion="permisos">Ahora no</button>
  </main></div>`;

PANTALLAS.pedidos = () => {
  const c = C();
  if (!libreParaPedidos()) return pantallaBloqueo();
  if (c.activo) return pantallaOcupado();
  if (!c.disponible) {
    return `<div class="pantalla">${headerCompleto('Desconectado · no recibes pedidos')}<main class="contenido">
      ${vacio('gris', 'moto', 'Estás desconectado', 'Activa el botón de arriba para empezar a recibir pedidos.', `<button class="btn" data-accion="switch">Conectarme</button>`)}
    </main>${nav('pedidos')}</div>`;
  }
  if (c.punto) return pantallaPunto();
  const aviso = S.aviso ? `<div class="aviso naranja">${ic('info')}<div><b>Otro domiciliario lo tomó primero</b><p>${esc(S.aviso)} ya no está disponible.</p></div></div>` : '';
  let volver = '';
  if (c.volverA) {
    const pv = puntoInfo(c.volverA);
    volver = `<section class="banner-volver"><div class="fila-top"><span class="ico-circ naranja">${ic('pin', 24)}</span><div class="parada-txt"><span class="nombre">¿Volviste a ${esc(pv.corto)}?</span><span class="dir">Entra de nuevo a la fila. Quedarás de último.</span></div><button class="cerrar-x" data-accion="no-volver" aria-label="No volver">${ic('x', 18, 2.5)}</button></div>
      <button class="btn" style="height:52px;font-size:18px" data-accion="elegir-punto" data-id="${pv.id}">Entrar a la fila</button></section>`;
  }
  const total = C().pedidos.length;
  return `<div class="pantalla">${headerCompleto()}<main class="contenido">
    ${aviso}${volver}
    <div class="seccion"><h2>Pedidos disponibles</h2><span class="contador">${total}</span></div>
    ${filtrosTipo()}
    ${listaCentral('Te avisaremos apenas llegue uno. Deja la app abierta o las notificaciones activas.')}
  </main>${nav('pedidos')}</div>`;
};
function pantallaPunto() {
  const c = C(), pi = puntoInfo(c.punto), f = filaDe(c.punto), pos = posicion();
  const delante = pos > 1 ? nombreFila(f[pos - 2]) : '';
  const fila = `<article class="card"><div class="card-pad" style="gap:12px">
    <div class="kv"><span class="lbl naranja" style="font-size:14px">Tu turno en ${esc(pi.corto)}</span><button class="btn-texto rojo chico" data-accion="salir-punto">Salir del punto</button></div>
    <div class="turno-fila"><span class="turno-num">${pos}°</span><div style="display:flex;flex-direction:column;gap:6px;min-width:0">
      <span class="dir">${pos === 1 ? 'en la fila · el próximo pedido es tuyo' : `en la fila · te toca después de ${esc(delante)}`}</span>
      <div class="fila-chips">${f.map((x, i) => `<span class="${x === yo() ? 'yo' : ''}">${i + 1} · ${esc(nombreFila(x))}</span>`).join('')}</div>
    </div></div>
    <div class="nota-cliente">${ic('clock', 16)}<span>Cuando te toque, tendrás ${SEG_TURNO} s para aceptarlo.</span></div>
    <div class="demo-mini"><button class="btn-texto" data-accion="demo-punto">${ic('tool', 18)} Prueba: el restaurante registra un pedido</button></div>
  </div></article>`;
  const toggle = `<article class="card"><div class="toggle-card"><div class="parada-txt" style="flex:1"><span style="font-size:16px;font-weight:700;color:var(--texto-fuerte)">Pedidos de la central</span><span style="font-size:13px;color:var(--texto-suave)">Si tomas uno, sales de la fila</span></div>
    <button class="switch mini ${c.centralEnPunto ? 'on' : ''}" data-accion="toggle-central" aria-label="Ver pedidos de la central" aria-pressed="${c.centralEnPunto}"><span></span></button></div></article>`;
  const central = c.centralEnPunto
    ? `<div class="seccion"><h2 style="font-size:20px">Pedidos de la central</h2><span class="contador">${C().pedidos.length}</span></div>${filtrosTipo()}${listaCentral('Cuando la central publique uno, aparecerá aquí.')}`
    : `<p class="solo-punto">Solo recibes pedidos de ${esc(pi.corto)}.</p>`;
  return `<div class="pantalla">${headerCompleto()}<main class="contenido">${fila}${toggle}${central}</main>${nav('pedidos')}</div>`;
}
function pantallaOcupado() {
  const a = C().activo, p = a.pedido, v = V(p);
  const lista = pedidosOrdenados();
  const etapa = a.paso === 1 ? v.lblA : (v.m ? 'Llevar a destino' : 'En camino');
  return `<div class="pantalla">${headerCompleto(`Tienes ${v.un} en curso`)}<main class="contenido">
    <button class="activo-card" data-accion="ir" data-a="activo">
      <span class="ico-circ naranja">${ic(v.m ? 'person' : 'moto', 26)}</span>
      <span class="parada-txt" style="flex:1"><span class="lbl naranja">${v.m ? 'Carrera activa' : 'Pedido activo'} · ${etapa}</span><span class="nombre">${esc(a.paso === 1 ? v.aOk : v.bOk)}</span><span class="dir">${esc(a.paso === 1 ? (v.m ? v.daOk : 'Entregar en ' + p.barrio) : v.dbOk)}</span></span>
      <span style="color:var(--naranja);display:flex">${ic('chev', 22, 2.5)}</span>
    </button>
    <div class="seccion"><h2>Pedidos disponibles</h2><span class="contador">${lista.length}</span></div>
    <p class="dir" style="margin:-6px 4px 0">Termina ${v.el} activ${v.m ? 'a' : 'o'} para tomar otro.</p>
    ${lista.map(q => { const w = V(q); return `<article class="card" style="border-color:var(--linea)"><div class="strip bloq">${chipTipo(q, 'gris')}<span style="font-weight:600">${hace(q.publicado)}</span></div><div class="card-pad">
      <div class="parada-txt"><span class="lbl" style="color:var(--gris)">${w.lblA}</span><span class="nombre" style="color:var(--texto-suave)">${esc(w.a)}</span><span class="dir" style="color:var(--gris)">${esc(w.m ? w.b : w.da)}</span></div>
      <div class="bloqueado">${ic('lock', 18)} Disponible al terminar</div></div></article>`; }).join('')}
  </main>${nav('pedidos')}</div>`;
}
function pantallaBloqueo() {
  const rev = C().cuota === 'revision';
  const cuerpo = rev
    ? vacio('amarillo', 'clock', 'Tu pago está en revisión', 'El administrador está revisando tu comprobante. Podrás tomar pedidos apenas lo apruebe.', `<button class="btn sec" data-accion="ir" data-a="cuota">Ver mi cuota</button>`)
    : `<div class="vacio"><div class="circulo circ-rojo">${ic('lock', 50)}</div><h2>Tienes la cuota pendiente</h2><p>Para volver a tomar pedidos, paga la cuota y avisa a la central.</p>
        <div class="monto-card"><span><small>Valor</small><b>${VALOR_CUOTA}</b></span><span class="desc-roja">Venció el ${fechaCorta(lunes(0))}</span></div>
        <button class="btn" data-accion="ir" data-a="cuota">Ver cómo pagar</button>
        <button class="btn sec" data-accion="ir" data-a="pago">Ya pagué, subir comprobante</button></div>`;
  return `<div class="pantalla">${headerCompleto(rev ? 'Pago en revisión · sin pedidos' : 'Cuota pendiente · sin pedidos')}<main class="contenido">${cuerpo}</main>${nav('pedidos')}</div>`;
}

PANTALLAS.verpedido = () => {
  const p = pedidoPorId(S.params.id);
  if (!p) return PANTALLAS.pedidos();
  const v = V(p);
  const extra = v.m
    ? cardPasajero(p) + `<div class="aviso amarillo">${ic('info')}<span>Lleva casco para el pasajero.</span></div>`
    : cardQueLlevas(p);
  return `<div class="pantalla">${subHeader(v.m ? 'Detalle de la carrera' : 'Detalle del pedido', 'pedidos')}<main class="contenido">
    <div class="kv">${chipTipo(p)}<span style="font-size:14px;color:var(--texto-suave)">${v.Servicio} #${p.id} · ${hace(p.publicado).toLowerCase()}</span></div>
    <article class="card"><div class="card-pad">${paradas(v.lblA, v.a, v.da, v.lblB, v.b, v.db)}<div class="chips">${chipKm(p)}${chipCobro(p)}</div></div></article>
    ${extra}
    <div class="grow"></div>
    <div class="accion-fila"><div class="precio"><small>${v.valorLbl}</small><b>${fmt(p.valor)}</b></div><button class="btn" data-accion="tomar" data-id="${p.id}">${v.verbo}</button></div>
  </main></div>`;
};

PANTALLAS.tomado = () => {
  const a = C().activo; if (!a) return PANTALLAS.pedidos();
  const p = a.pedido, v = V(p);
  const origen = p.origen === 'punto' ? `<span class="badge naranja" style="align-self:center">${ic('pin', 13, 2.2)}Pedido del punto ${esc(puntoInfo(p.punto).corto)}</span>` : '';
  return `<div class="pantalla">
    <header class="hero"><div class="circ-grande" style="background:var(--accion)">${ic('check', 44, 3)}</div><h1>${v.m ? 'La carrera es tuya' : 'El pedido es tuyo'}</h1><p>${v.m ? 'Ve por el pasajero. Ya puedes ver la dirección exacta.' : 'Ahora ve a recogerlo. Ya puedes ver la dirección completa.'}</p></header>
    <main class="contenido" style="padding-top:20px">
      ${origen}
      <article class="card"><div class="card-pad">
        ${paradas(v.lblA, v.aOk, v.daOk, v.lblB, v.bOk, v.dbOk, !v.m && p.nota ? `<span class="dir" style="font-size:14px">${esc(p.nota)}</span>` : '')}
        <div class="chips">${chipKm(p)}${chipCobro(p)}<span class="chip amarillo">${v.valorLbl} ${fmt(p.valor)}</span></div>
      </div></article>
      ${v.m ? cardPasajero(p) : cardQueLlevas(p)}
      <div class="tiempos-mini"><span>${ic('clock', 16)} ${v.m ? 'Tomada' : 'Tomado'} a las ${hora(a.tomado)}</span></div>
      <div class="grow"></div>
      <button class="btn grande" data-accion="ir" data-a="activo">${ic('nav', 22, 2.2)} ${v.m ? 'Ir por el pasajero' : 'Ir a recoger'}</button>
    </main></div>`;
};

PANTALLAS.activo = () => {
  const c = C(), a = c.activo;
  if (!a) {
    const extra = c.punto ? `<p class="dir">Estás en la fila de ${esc(puntoInfo(c.punto).corto)} (${posicion()}°).</p>` : '';
    return `<div class="pantalla">${headerTab('Activo')}<main class="contenido">
      ${vacio('amarillo', 'moto', 'No tienes nada en curso', 'Cuando tomes un pedido o una carrera, aquí verás a dónde ir y qué cobrar.', `${extra}<button class="btn" data-accion="ir" data-a="pedidos">Ver pedidos</button>`)}
    </main>${nav('activo')}</div>`;
  }
  const p = a.pedido, v = V(p);
  const header = `<header class="header" style="gap:14px;padding-bottom:20px"><div class="header-fila">${marca()}${campana()}</div>
    <div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:baseline;justify-content:space-between"><h1 class="h-titulo">${v.m ? 'Carrera activa' : 'Pedido activo'}</h1><span style="font-size:15px;font-weight:700">Paso ${a.paso} de 2</span></div>
    <div class="pasos"><span class="lleno"></span><span class="${a.paso === 2 ? 'lleno' : ''}"></span></div></div></header>`;
  const novedad = a.novedad ? `<div class="aviso amarillo">${ic('alert')}<div><b>Novedad reportada</b><p>${esc(a.novedad)} · la central te contactará.</p></div></div>` : '';
  const botonesContacto = (dir, llamar = true) => llamar
    ? `<div class="duo"><a class="mini azul" href="${maps(dir)}" target="_blank" rel="noopener">${ic('nav', 20)} Abrir en Maps</a><button class="mini naranja" data-accion="llamar">${ic('phone', 20)} Llamar</button></div>`
    : `<a class="mini azul" href="${maps(dir)}" target="_blank" rel="noopener">${ic('nav', 20)} Abrir en Maps</a>`;
  let cuerpo;
  if (a.paso === 1 && !v.m) {
    cuerpo = `${novedad}
      <article class="card"><div class="card-pad">
        <div class="fila-ico"><span class="ico-circ azul">${ic('store', 24)}</span><div class="parada-txt"><span class="lbl azul">Ir a recoger</span><span class="grande-nombre">${esc(p.negocio)}</span><span class="dir" style="font-size:16px">${esc(p.dirNegocio)}</span></div></div>
        <div class="nota-cliente">${ic('bag', 18)}<span>Recoges: ${esc(p.resumen)}</span></div>
        ${botonesContacto(p.dirNegocio)}
      </div></article>
      <article class="card"><div class="card-pad" style="gap:10px;padding:16px 18px">
        <span class="lbl naranja">Después entregas en</span>
        <div class="parada-txt"><span class="nombre">${esc(p.cliente)}</span><span class="dir">${esc(p.dirCliente)}</span></div>
        <div class="chips">${chipCobro(p)}<span class="chip amarillo">Domicilio ${fmt(p.valor)}</span></div>
      </div></article>`;
  } else if (a.paso === 1 && v.m) {
    cuerpo = `${novedad}
      <article class="card"><div class="card-pad">
        <div class="fila-ico"><span class="ico-circ azul">${ic('person', 24)}</span><div class="parada-txt"><span class="lbl azul">Recoger pasajero</span><span class="grande-nombre">${esc(p.pasajero)}</span><span class="dir" style="font-size:16px">${esc(p.dirRecogida)}</span></div></div>
        ${p.nota ? `<div class="nota-cliente">${ic('note', 18)}<span>${esc(p.nota)}</span></div>` : ''}
        ${botonesContacto(p.dirRecogida)}
      </div></article>
      <article class="card"><div class="card-pad" style="gap:10px;padding:16px 18px">
        <span class="lbl naranja">Después la llevas a</span>
        <div class="parada-txt"><span class="nombre">${esc(p.destino)}</span><span class="dir">${esc(p.dirDestino)}</span></div>
        <div class="chips"><span class="chip morado">${ic('cash', 16)} Cobrar ${fmt(p.cobrar)}</span><span class="chip gris">${esc(p.resumen)}</span></div>
      </div></article>`;
  } else if (!v.m) {
    cuerpo = `${novedad}
      <article class="card"><div class="card-pad">
        <div class="fila-ico"><span class="ico-circ naranja">${ic('home', 24)}</span><div class="parada-txt"><span class="lbl naranja">Entregar a</span><span class="grande-nombre">${esc(p.cliente)}</span><span class="dir" style="font-size:16px">${esc(p.dirCliente)}</span></div></div>
        ${p.nota ? `<div class="nota-cliente">${ic('note', 18)}<span>${esc(p.nota)}</span></div>` : ''}
        ${botonesContacto(p.dirCliente)}
      </div></article>
      ${p.cobrar > 0
        ? `<div class="morado-box"><span class="circ">${ic('cash', 24)}</span><div><small>Cobrar al cliente</small><b>${fmt(p.cobrar)}</b><span class="s">Efectivo o transferencia</span></div></div>`
        : `<div class="aviso amarillo">${ic('check')}<div><b>Pedido ya pagado</b><p>No le cobres nada al cliente.</p></div></div>`}`;
  } else {
    cuerpo = `${novedad}
      <article class="card"><div class="card-pad">
        <div class="fila-ico"><span class="ico-circ naranja">${ic('pin', 24)}</span><div class="parada-txt"><span class="lbl naranja">Llevar a</span><span class="grande-nombre">${esc(p.destino)}</span><span class="dir" style="font-size:16px">${esc(p.dirDestino)}</span></div></div>
        ${botonesContacto(p.dirDestino, false)}
      </div></article>
      <div class="morado-box"><span class="circ">${ic('cash', 24)}</span><div><small>Cobrar al pasajero</small><b>${fmt(p.cobrar)}</b><span class="s">Efectivo o transferencia</span></div></div>
      <div class="card-borde" style="flex-direction:row;align-items:center;gap:10px;padding:12px 16px">${ic('person', 20)}<span><b style="color:var(--texto-fuerte)">${esc(p.pasajero)}</b> · ${esc(p.resumen)}</span></div>`;
  }
  const tiempos = a.paso === 2 ? `<div class="tiempos-mini"><span>${ic('clock', 16)} ${v.m ? 'Tomada' : 'Tomado'} ${hora(a.tomado)}</span><span>Recogido ${hora(a.recogido)}</span></div>` : '';
  const abajo = a.paso === 1
    ? `<div class="duo"><button class="btn-texto" data-accion="ir" data-a="novedad">Reportar novedad</button><button class="btn-texto rojo" data-accion="ir" data-a="cancelar">Cancelar ${v.servicio}</button></div>
       <button class="btn grande" data-accion="recogido">${ic('check', 22, 2.6)} ${v.m ? 'Ya recogí al pasajero' : 'Ya recogí el pedido'}</button>`
    : `<button class="btn-texto" data-accion="ir" data-a="novedad">Reportar novedad</button>
       <button class="btn grande" data-accion="entregado">${ic('check', 22, 2.6)} ${v.m ? 'Terminar carrera' : 'Entregado'}</button>`;
  return `<div class="pantalla">${header}<main class="contenido">${cuerpo}${tiempos}<div class="grow"></div>${abajo}</main>${nav('activo')}</div>`;
};

PANTALLAS.novedad = () => {
  const a = C().activo; if (!a) return PANTALLAS.activo();
  const lista = V(a.pedido).m ? NOVEDADES_MOTO : NOVEDADES;
  const sel = S.sel.novedad || lista[0];
  return `<div class="pantalla">${subHeader('Reportar novedad', 'activo')}<main class="contenido" style="padding-top:18px">
    <span class="pregunta">¿Qué pasó?</span>
    <div class="opciones">${lista.map(n => opcion('novedad', n, n, n === sel)).join('')}</div>
    <div class="campo"><label for="nota-nov">Cuéntale a la central (opcional)</label><textarea class="input" id="nota-nov" placeholder="Ej: llamé 3 veces y no contesta"></textarea></div>
    <div class="nota-p">${ic('info', 18)}<span>La central te dirá si esperas, devuelves o cambias la dirección.</span></div>
    <div class="grow"></div>
    <button class="btn" data-accion="enviar-novedad">Enviar a la central</button>
  </main></div>`;
};

PANTALLAS.cancelar = () => {
  const a = C().activo;
  if (!a || a.paso !== 1) return PANTALLAS.activo();
  const v = V(a.pedido);
  const sel = S.sel.cancelar || MOTIVOS_CANCELAR[0];
  return `<div class="pantalla">${subHeader('Cancelar ' + v.servicio, 'activo')}<main class="contenido" style="padding-top:18px">
    <div class="aviso rojo">${ic('alert', 24)}<div><b>Solo puedes cancelar antes de recoger</b><p>La central verá el motivo y quedará en tu historial.</p></div></div>
    <span class="pregunta">¿Por qué cancelas?</span>
    <div class="opciones">${MOTIVOS_CANCELAR.map(n => opcion('cancelar', n, n, n === sel)).join('')}</div>
    <div class="campo"><label for="nota-can">Detalle (opcional)</label><textarea class="input" id="nota-can" placeholder="Cuéntale a la central qué pasó"></textarea></div>
    <div class="grow"></div>
    <button class="btn rojo" data-accion="confirmar-cancelar">Cancelar ${v.servicio}</button>
    <button class="btn sec" data-accion="ir" data-a="activo">Volver</button>
  </main></div>`;
};

PANTALLAS.cancelado = () => {
  const c = S.cancelado || { a: '', b: '', motivo: '', m: false };
  return `<div class="pantalla">
    <header class="hero rojo"><div class="circ-grande" style="background:var(--rojo)">${ic('x', 44, 3)}</div><h1 style="font-size:28px">La central canceló ${c.m ? 'la carrera' : 'el pedido'}</h1><p style="font-size:17px;font-weight:700;color:var(--rojo-texto)">No sigas con ${c.m ? 'esta carrera' : 'este pedido'}.</p></header>
    <main class="contenido" style="padding-top:20px">
      <article class="card"><div class="card-pad">
        <div class="parada-txt"><span class="lbl rojo">Motivo</span><span class="nombre">${esc(c.motivo)}</span></div>
        <div class="sep"></div>
        <div style="display:flex;flex-direction:column;gap:10px;font-size:16px;font-weight:700;color:var(--texto-fuerte)">
          <div style="display:flex;align-items:center;gap:10px"><span class="dot-azul"></span>${esc(c.a)}</div>
          <div style="display:flex;align-items:center;gap:10px"><span class="dot-naranja"></span>${esc(c.b)}</div>
        </div>
      </div></article>
      <div class="aviso amarillo">${ic('info')}<span>${c.recogido ? (c.m ? 'Deja al pasajero en un lugar seguro y avisa a la central.' : 'Ya lo habías recogido: devuélvelo al negocio y avisa a la central.') : 'Si ibas en camino, no sigas.'}</span></div>
      <div class="pill-verde"><i></i>Ya estás libre para tomar otro</div>
      <div class="grow"></div>
      <button class="btn" data-accion="ir" data-a="pedidos">Volver a pedidos</button>
    </main></div>`;
};

PANTALLAS.historial = () => {
  const f = S.filtro;
  const lista = C().historial.filter(h => f === 'semana' || (f === 'hoy' ? esHoy(h.tiempos.publicado) : esAyer(h.tiempos.publicado)));
  const ok = lista.filter(h => h.estado === 'entregado');
  const suma = ok.reduce((s, h) => s + h.valor, 0);
  const prom = ok.length ? Math.round(ok.reduce((s, h) => s + (h.tiempos.entregado - h.tiempos.tomado), 0) / ok.length / 60000) : 0;
  const filtros = `<div class="filtros">${[['hoy', 'Hoy'], ['ayer', 'Ayer'], ['semana', 'Esta semana']].map(([k, l]) => `<button class="${f === k ? 'sel' : ''}" data-accion="filtro" data-v="${k}" aria-pressed="${f === k}">${l}</button>`).join('')}</div>`;
  const etiqueta = f === 'hoy' ? 'Hoy · ' + fechaLarga(new Date()) : f === 'ayer' ? 'Ayer · ' + fechaLarga(new Date(ahora() - 864e5)) : 'Esta semana';
  const filas = lista.length ? `<div class="lista">${lista.map(filaHistorial).join('')}</div>` : vacio('gris', 'history', 'Sin servicios en este periodo', 'Aquí verás los pedidos y carreras que hagas.');
  return `<div class="pantalla">${headerTab('Historial', filtros)}<main class="contenido">
    <div class="tiles"><div class="tile"><span>Servicios</span><b>${ok.length}</b></div><div class="tile"><span>Ganado</span><b style="color:var(--naranja)">${fmt(suma)}</b></div><div class="tile"><span>Prom. entrega</span><b>${prom ? prom + ' min' : '—'}</b></div></div>
    <div class="etq-dia">${etiqueta}</div>${filas}
  </main>${nav('historial')}</div>`;
};
function filaHistorial(h) {
  const v = V(h), ok = h.estado === 'entregado';
  const [hh, ap] = horaPartes(ok ? h.tiempos.entregado : h.tiempos.cancelado);
  const estado = ok ? `<span class="badge gris">${ic('check', 12, 3)}${v.hecho}</span>` : `<span class="badge rojo">${ic('x', 12, 3)}${v.cancelado}</span>`;
  return `<button class="fila" data-accion="detalle" data-id="${h.id}">
    <span class="hora"><b>${hh}</b><small>${ap}</small></span>
    <span class="medio"><b>${esc(v.titulo)}</b><span class="badges">${chipTipo(h, 'peq')}${estado}</span></span>
    <span class="monto" ${ok ? '' : 'style="color:var(--gris)"'}>${fmt(ok ? h.valor : 0)}</span>
    <span class="chev">${ic('chev', 18, 2.5)}</span></button>`;
}

PANTALLAS.detalle = () => {
  const h = C().historial.find(x => String(x.id) === String(S.params.id));
  if (!h) return PANTALLAS.historial();
  const v = V(h), t = h.tiempos, ok = h.estado === 'entregado';
  const pasos = [['Publicado', '#A8A29E', t.publicado], [v.m ? 'Tomada' : 'Tomado', 'var(--accion)', t.tomado]];
  if (t.recogido) pasos.push(['Recogido', 'var(--azul)', t.recogido]);
  pasos.push(ok ? [v.hecho, 'var(--naranja)', t.entregado] : [v.cancelado, 'var(--rojo)', t.cancelado]);
  const filas = pasos.map(([n, col, ts], i) => `<div class="linea-t"><span class="dot" style="background:${col}"></span><span class="n">${n}</span><span>${hora(ts)}</span><small>${i ? '+' + Math.max(0, Math.round((ts - pasos[i - 1][2]) / 60000)) + ' min' : ''}</small></div>`).join('');
  const pago = h.cobrado > 0 ? `${fmt(h.cobrado)} · ${h.pago === 'transferencia' ? 'Transferencia' : 'Efectivo'}` : (ok ? 'Ya estaba pagado' : '—');
  const origen = h.origen === 'punto' && h.punto ? `Punto · ${puntoInfo(h.punto).corto}` : 'Central';
  return `<div class="pantalla">${subHeader(v.m ? 'Detalle de la carrera' : 'Detalle del pedido', 'historial')}<main class="contenido">
    <article class="card"><div class="card-pad">
      <div class="kv"><span style="display:inline-flex;align-items:center;gap:8px">${chipTipo(h)}<span style="font-size:15px;font-weight:700;color:var(--texto-suave)">#${h.id}</span></span>${ok ? `<span class="badge gris">${ic('check', 13, 3)}${v.hecho}</span>` : `<span class="badge rojo">${ic('x', 13, 3)}${v.cancelado}</span>`}</div>
      ${paradas(v.lblA, v.aOk, v.daOk, v.lblB, v.bOk, v.dbOk)}
      <div class="kv" style="font-size:15px"><span style="color:var(--texto-suave)">Origen</span><b>${esc(origen)}</b></div>
    </div></article>
    ${ok ? '' : `<div class="aviso rojo">${ic('alert')}<div><b>${h.por === 'central' ? 'Cancelado por la central' : 'Cancelado por ti'}</b><p>${esc(h.motivo)}</p></div></div>`}
    ${v.m ? cardPasajero(h, false) : cardQueLlevas(h, ok ? 'Qué llevaste' : 'Qué ibas a llevar')}
    <article class="card"><div class="card-pad">
      <span class="titulo-card">${ic('clock', 20)} Tiempos</span>${filas}
      ${ok ? `<div class="sep"></div><div class="kv"><span style="font-weight:700;color:var(--texto-fuerte)">Tiempo total</span><b style="font-size:22px;color:var(--naranja)">${Math.round((t.entregado - t.tomado) / 60000)} min</b></div>` : ''}
    </div></article>
    <article class="card"><div class="card-pad" style="gap:12px">
      <span class="titulo-card">${ic('cash', 20)} Dinero</span>
      <div class="kv"><span>${v.valorLbl}</span><b>${fmt(ok ? h.valor : 0)}</b></div>
      <div class="kv"><span>Cobrado</span><b style="color:var(--morado)">${pago}</b></div>
    </div></article>
  </main></div>`;
};

PANTALLAS.perfil = () => {
  const u = U(), c = C();
  const cuota = c.cuota === 'al_dia' ? { b: `<span class="badge verde">${ic('check', 13, 3)}Al día</span>`, s: `Próxima: ${fechaLarga(lunes(1))}` }
    : c.cuota === 'vencida' ? { b: `<span class="badge rojo">${ic('alert', 13, 2.5)}Vencida</span>`, s: `Venció el ${fechaLarga(lunes(0))}` }
    : { b: `<span class="badge amarillo">${ic('clock', 13, 2.5)}En revisión</span>`, s: 'Comprobante enviado' };
  const fila = (i, t, v) => `<button class="menu-fila" data-accion="menu" data-v="${v}"><span class="ico">${ic(i)}</span><span class="txt">${t}</span><span class="chev">${ic('chev', 18, 2.5)}</span></button>`;
  return `<div class="pantalla">${headerTab('Mi perfil')}<main class="contenido" style="gap:14px">
    <article class="card"><div class="perfil-card"><div class="avatar" aria-hidden="true">${u.iniciales}</div><div class="parada-txt" style="gap:2px"><span style="font-size:20px;font-weight:800;color:var(--texto-fuerte)">${esc(u.nombre)}</span><span class="dir">${telFmt(S.tel)}</span><span style="display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--texto-suave)"><span style="color:var(--naranja);display:flex">${ic('moto', 16)}</span>${u.placa} · ${u.moto}</span></div></div></article>
    <div class="lista">
      <button class="menu-fila" data-accion="ir" data-a="cuota" style="min-height:72px"><span class="ico-circ amarillo" style="width:44px;height:44px">${ic('wallet')}</span><span class="txt"><span>Cuota</span><small>${cuota.s}</small></span>${cuota.b}<span class="chev">${ic('chev', 18, 2.5)}</span></button>
      ${fila('user', 'Datos personales', 'datos')}${fila('msg', 'Contactar a la central', 'central')}${fila('shield', 'Tratamiento de datos', 'privacidad')}
    </div>
    <section class="demo"><h3>${ic('tool', 18)} Herramientas de prueba</h3><p>Simula lo que harían la central o un restaurante para ver las demás pantallas.</p>
      <button data-accion="demo-nuevo">${ic('plus', 18)} Llega un pedido nuevo de la central</button>
      <button data-accion="demo-punto">${ic('store', 18)} El restaurante de mi punto registra un pedido</button>
      <button data-accion="demo-cancelar">${ic('x', 18)} La central cancela lo que tengo activo</button>
      <button data-accion="demo-vaciar">${ic('list', 18)} Vaciar la lista de pedidos</button>
      <button data-accion="demo-reiniciar">${ic('refresh', 18)} Reiniciar la prueba</button>
    </section>
    <button class="btn salir" data-accion="cerrar-sesion">${ic('logout', 20, 2.2)} Cerrar sesión</button>
    <p class="centro" style="margin:0;font-size:13px;color:var(--gris)">TuDomiYa · prototipo</p>
  </main>${nav('perfil')}</div>`;
};

PANTALLAS.cuota = () => {
  const e = C().cuota;
  let estado;
  if (e === 'al_dia') {
    estado = `<article class="card"><div class="card-pad" style="gap:10px">
      <div class="kv"><span style="font-size:15px;font-weight:700;color:var(--texto-suave)">Cuota de esta semana</span><span class="badge verde">${ic('check', 13, 3)}Al día</span></div>
      <span class="monto-grande">${VALOR_CUOTA}</span>
      <span class="lbl-fecha">${ic('cal', 18)} Próxima cuota: ${fechaLarga(lunes(1))}</span>
    </div></article>`;
  } else if (e === 'vencida') {
    estado = `<article class="card"><div class="card-pad" style="gap:10px">
      <div class="kv"><span style="font-size:15px;font-weight:700;color:var(--texto-suave)">Cuota de esta semana</span><span class="badge rojo">${ic('alert', 13, 2.5)}Vencida</span></div>
      <span class="monto-grande">${VALOR_CUOTA}</span>
      <span class="lbl-fecha rojo">${ic('cal', 18)} Venció el ${fechaLarga(lunes(0))}</span>
      <button class="btn" style="height:56px;font-size:18px;margin-top:4px" data-accion="ir" data-a="pago">Ya pagué, subir comprobante</button>
    </div></article>`;
  } else {
    estado = `<article class="card"><div class="card-pad" style="gap:10px">
      <div class="kv"><span style="font-size:15px;font-weight:700;color:var(--texto-suave)">Cuota de esta semana</span><span class="badge amarillo">${ic('clock', 13, 2.5)}En revisión</span></div>
      <span class="monto-grande">${VALOR_CUOTA}</span>
      <span style="font-size:15px;color:var(--texto-suave)">Enviaste tu comprobante. El administrador lo está revisando.</span>
      <div class="demo-mini"><button class="btn-texto" data-accion="aprobar">${ic('tool', 18)} Prueba: simular que el admin aprobó</button></div>
    </div></article>`;
  }
  const como = `<article class="card"><div class="card-pad" style="gap:12px;padding:16px 18px">
    <span class="titulo-card">Cómo pagar</span>
    <div class="fila-ico" style="align-items:center"><span class="ico-circ morado" style="width:42px;height:42px">${ic('mobile', 20)}</span><div class="parada-txt"><span class="nombre" style="font-size:16px">Nequi</span><span class="dir" style="font-size:14px">Al número de la central: ${NEQUI_CENTRAL}</span></div></div>
    <div class="fila-ico" style="align-items:center"><span class="ico-circ naranja" style="width:42px;height:42px">${ic('store', 20)}</span><div class="parada-txt"><span class="nombre" style="font-size:16px">Efectivo</span><span class="dir" style="font-size:14px">En la oficina de la central</span></div></div>
  </div></article>`;
  const semanas = (e === 'al_dia' ? [0, -1] : [-1, -2]).map(o => `<div class="kv"><span>${rangoSemana(o)}</span><span style="display:flex;align-items:center;gap:10px"><span class="badge gris">${ic('check', 12, 3)}Pagada</span><b>${VALOR_CUOTA}</b></span></div>`).join('');
  const anteriores = `<article class="card"><div class="card-pad" style="gap:10px;padding:16px 18px"><span class="titulo-card">Pagos anteriores</span>${semanas}</div></article>`;
  return `<div class="pantalla">${subHeader('Mi cuota', 'perfil')}<main class="contenido">${estado}${como}${anteriores}</main>${nav('perfil')}</div>`;
};

function contenidoSubir() {
  return S.foto
    ? `<img src="${S.foto}" alt="Comprobante cargado"><span style="font-size:14px;font-weight:700">Toca para cambiar la foto</span>`
    : `${ic('image', 36)}<span style="font-size:16px;font-weight:700">Toca para subir la foto</span><span style="font-size:13px;color:var(--texto-suave)">Captura de Nequi o foto del recibo</span>`;
}
PANTALLAS.pago = () => {
  const m = S.sel.metodo || 'Nequi';
  return `<div class="pantalla">${subHeader('Avisar pago', 'cuota')}<main class="contenido" style="padding-top:18px">
    <span class="pregunta">¿Cómo pagaste?</span>
    <div class="opciones">${['Nequi', 'Transferencia bancaria', 'Efectivo en la central'].map(k => opcion('metodo', k, k, m === k)).join('')}</div>
    <div class="campo"><span class="lbl-campo">Foto del comprobante</span>
      <label class="subir"><span id="subir-contenido" style="display:contents">${contenidoSubir()}</span><input type="file" accept="image/*" id="foto"></label>
      <p class="error" id="err-foto" hidden>Sube la foto del comprobante.</p></div>
    <div class="campo"><label for="valor">Valor pagado</label><input class="input" id="valor" inputmode="numeric" placeholder="${VALOR_CUOTA}"></div>
    <div class="nota-p">${ic('info', 18)}<span>El administrador revisará tu pago. Cuando lo apruebe, podrás tomar pedidos de nuevo.</span></div>
    <div class="grow"></div>
    <button class="btn" data-accion="enviar-pago">Enviar comprobante</button>
  </main></div>`;
};

/* ---------- Hojas y diálogos ---------- */
const SHEETS = {};
function hoja(contenido, { cerrable = true, clase = '', rol = 'dialog' } = {}) {
  return `<div class="sheet-fondo" data-accion="${cerrable ? 'cerrar-sheet' : 'nada'}"><div class="sheet ${clase}" role="${rol}" aria-modal="true" aria-labelledby="t-sheet" data-accion="nada">${contenido}</div></div>`;
}
const encabezado = (icono, fondo, color, titulo, texto = '') => `<span class="agarre"></span><div class="sheet-centro"><span class="ico-grande" style="background:${fondo};color:${color}">${ic(icono, 28)}</span><h2 id="t-sheet">${titulo}</h2>${texto ? `<p>${texto}</p>` : ''}</div>`;
function resumenServicio(p) {
  const v = V(p);
  return `<div class="card-borde">
    <div class="mini-paradas">
      <div><span class="dot-azul"></span><span class="t"><b>${esc(v.a)}</b><small>${esc(v.da)}</small></span></div>
      <div><span class="dot-naranja"></span><span class="t"><b>${esc(v.b)}</b><small>${esc(v.db)}</small></span></div>
    </div>
    <span style="font-size:15px">${esc(p.resumen)}</span>
    <div class="chips">${chipKm(p)}${chipCobro(p)}<span class="chip amarillo">${v.valorLbl} ${fmt(p.valor)}</span></div>
  </div>`;
}
const lineaApartado = p => `<div class="aviso amarillo apartado">${ic('clock', 20)}<span style="flex:1">Te ${V(p).m ? 'la' : 'lo'} apartamos mientras confirmas</span><b id="cuenta">0:${String(SEG_APARTADO).padStart(2, '0')}</b></div>`;

SHEETS.tomar = () => {
  const p = pedidoPorId(S.sheetParams.id); if (!p) return '';
  const v = V(p);
  return hoja(`${encabezado(v.icono, v.m ? 'var(--naranja)' : 'var(--suave)', v.m ? '#fff' : 'var(--naranja)', `¿Tomar ${v.art} ${v.servicio}?`, v.m ? 'Vas a recoger a un pasajero y llevarlo a su destino.' : 'Al confirmar queda a tu nombre y la central lo verá.')}
    ${resumenServicio(p)}
    ${v.m ? `<div class="aviso amarillo" style="padding:10px 14px">${ic('info', 20)}<span>Lleva casco para el pasajero.</span></div>` : ''}
    ${lineaApartado(p)}
    <button class="btn" data-accion="confirmar-tomar">Sí, ${v.verbo.toLowerCase()}</button>
    <button class="btn sec" data-accion="cerrar-sheet">Cancelar</button>`);
};
SHEETS.central = () => {
  const c = C(), p = pedidoPorId(S.sheetParams.id); if (!p || !c.punto) return '';
  const v = V(p), pi = puntoInfo(c.punto);
  return hoja(`${encabezado('alert', 'var(--amarillo-suave)', 'var(--naranja)', 'Vas a salir de la fila', `Para tomar ${v.art} ${v.servicio} de la central dejas tu turno en ${esc(pi.corto)}.`)}
    <div class="comparar"><div class="comp neutro"><small>Ahora</small><b>${posicion()}°</b><small>en ${esc(pi.corto)}</small></div><span class="flecha">${ic('arrowR', 22, 2.5)}</span><div class="comp rojo"><small>Al volver</small><b class="medio">Último</b><small>de la fila</small></div></div>
    <div class="card-borde" style="flex-direction:row;align-items:center;gap:12px;padding:12px 14px"><span class="ico-circ naranja" style="width:40px;height:40px">${ic(v.icono, 20)}</span><span class="parada-txt" style="flex:1"><b style="font-size:15px;color:var(--texto-fuerte)">${esc(v.a)} → ${esc(v.b)}</b><small style="font-size:13px;color:var(--texto-suave)">${v.etiqueta} de la central · ${p.km} km</small></span><b style="font-size:17px;color:var(--texto-fuerte)">${fmt(p.valor)}</b></div>
    ${lineaApartado(p)}
    <button class="btn" style="font-size:19px" data-accion="confirmar-central">Tomar y salir de la fila</button>
    <button class="btn sec" data-accion="cerrar-sheet">Seguir en la fila</button>`);
};
SHEETS.tetoca = () => {
  const p = S.tetoca; if (!p) return '';
  const pi = puntoInfo(p.punto), v = V(p);
  return hoja(`<div class="tt-head"><div class="tt-ring"><svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="31" fill="none" stroke="#FB923C" stroke-width="6"/><circle id="tt-arco" cx="36" cy="36" r="31" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="194.8" stroke-dashoffset="0" transform="rotate(-90 36 36)"/></svg><span><b id="tt-num">${SEG_TURNO}</b><small>seg</small></span></div>
      <div><h2 id="t-sheet">¡Te toca!</h2><span class="s">Nuevo pedido de ${esc(pi.corto)}</span></div></div>
    <div class="tt-cuerpo">
      <div class="card-borde">
        <div class="mini-paradas"><div><span class="dot-naranja"></span><span class="t"><small style="color:var(--naranja);font-weight:700;font-size:13px">Entregar</small><b style="font-size:18px">${esc(p.barrio)}</b><small>Ves la dirección completa al aceptar</small></span></div></div>
        <span style="font-size:15px">${esc(p.resumen)}</span>
        <div class="chips">${chipKm(p)}${chipCobro(p)}<span class="chip amarillo">${v.valorLbl} ${fmt(p.valor)}</span></div>
      </div>
      <p class="centro" style="margin:0;font-size:14px;color:var(--texto-suave)">Si no respondes a tiempo, pasa al siguiente de la fila.</p>
      <button class="btn grande" data-accion="aceptar-turno">Aceptar pedido</button>
      <button class="btn sec doble" data-accion="pasar-turno"><span>Pasar turno</span><small>Quedarás de último en la fila</small></button>
    </div>`, { cerrable: false, clase: 'sin-pad', rol: 'alertdialog' });
};
SHEETS.cambiar = () => {
  const c = C(); if (!c.punto) return '';
  const a = puntoInfo(c.punto), b = puntoInfo(S.sheetParams.id), n = otrosEnFila(b.id);
  return hoja(`${encabezado('swap', 'var(--suave)', 'var(--naranja)', '¿Cambiar de punto?', `Sales de la fila de ${esc(a.corto)} y entras de último en la nueva.`)}
    <div class="cambio rojo"><span class="tag-cambio">SALES</span><span class="parada-txt"><b>${esc(a.nombre)}</b><small>Pierdes tu turno (eres ${posicion()}°)</small></span></div>
    <div class="cambio verde"><span class="tag-cambio">ENTRAS</span><span class="parada-txt"><b>${esc(b.nombre)} · a ${fmtDist(b.m)}</b><small>Quedarías ${n + 1}° ${n ? `(${n} delante)` : '(nadie en la fila)'}</small></span></div>
    <button class="btn" style="font-size:19px" data-accion="confirmar-cambio">Cambiar a ${esc(b.corto)}</button>
    <button class="btn sec" data-accion="cerrar-sheet">Quedarme en ${esc(a.corto)}</button>`);
};
SHEETS.salir = () => {
  const c = C(); if (!c.punto) return '';
  const a = puntoInfo(c.punto);
  return hoja(`${encabezado('logout', 'var(--rojo-suave)', 'var(--rojo)', `¿Salir de la fila de ${esc(a.corto)}?`)}
    <ul class="vinetas"><li class="r"><span>Pierdes tu turno: eres <b>${posicion()}° de ${filaDe(c.punto).length}</b>.</span></li><li class="n"><span>Pasas a <b>Sin punto</b> y solo ves pedidos de la central.</span></li><li><span>Si vuelves, entras de último.</span></li></ul>
    <button class="btn rojo" data-accion="confirmar-salir">Salir del punto</button>
    <button class="btn sec" data-accion="cerrar-sheet">Seguir en la fila</button>`);
};
SHEETS.desconectar = () => {
  const c = C(); if (!c.punto) return '';
  return hoja(`${encabezado('power', 'var(--gris-claro)', 'var(--texto-suave)', '¿Desconectarte?', 'Dejas de recibir pedidos y avisos hasta que te vuelvas a conectar.')}
    <div class="aviso rojo" style="padding:12px 14px">${ic('alert', 20)}<span>También sales de la fila de ${esc(puntoInfo(c.punto).corto)} (eres ${posicion()}°).</span></div>
    <button class="btn gris" data-accion="confirmar-desconectar">Desconectarme</button>
    <button class="btn sec" data-accion="cerrar-sheet">Seguir conectado</button>`);
};
SHEETS.cerrar = () => {
  const c = C();
  return hoja(`${encabezado('logout', 'var(--rojo-suave)', 'var(--rojo)', '¿Cerrar sesión?', 'Dejas de recibir pedidos en este celular.')}
    ${c.punto ? `<div class="aviso rojo" style="padding:12px 14px">${ic('alert', 20)}<span>Estás en la fila de ${esc(puntoInfo(c.punto).corto)}: perderás tu turno (${posicion()}°).</span></div>` : ''}
    <button class="btn rojo" data-accion="salir">Cerrar sesión</button>
    <button class="btn sec" data-accion="cerrar-sheet">Cancelar</button>`);
};
SHEETS.activoAviso = () => {
  const a = C().activo; if (!a) return '';
  const v = V(a.pedido);
  return hoja(`${encabezado('lock', 'var(--amarillo-suave)', 'var(--naranja)', `Tienes ${v.un} en curso`, `Termina o cancela ${v.el} antes de ${esc(S.sheetParams.accion || 'continuar')}.`)}
    <button class="btn" data-accion="ir" data-a="activo">Ver mi ${v.servicio}</button>
    <button class="btn sec" data-accion="cerrar-sheet">Entendido</button>`, { rol: 'alertdialog' });
};
SHEETS.confirmar = () => {
  const a = C().activo; if (!a) return '';
  const p = a.pedido, v = V(p), m = S.sel.pago || 'efectivo';
  const ops = p.cobrar > 0 ? [['efectivo', 'cash', 'morado', 'Efectivo', `Recibí ${fmt(p.cobrar)}`], ['transferencia', 'mobile', 'azul', 'Transferencia', 'Nequi o cuenta bancaria']] : [];
  const titulo = p.cobrar > 0 ? `¿Cómo pagó el ${v.m ? 'pasajero' : 'cliente'}?` : 'Confirmar entrega';
  return hoja(`<span class="agarre"></span>
    <div><h2 id="t-sheet">${titulo}</h2><p class="sub">${p.cobrar > 0 ? `Confirma el cobro para cerrar ${v.el}.` : 'Este pedido ya estaba pagado.'}</p></div>
    ${p.cobrar > 0 ? `<div class="morado-fila"><span>Valor a cobrar</span><b>${fmt(p.cobrar)}</b></div>` : ''}
    ${ops.map(([k, i, col, t, s]) => `<button class="opcion grande-op ${m === k ? 'sel' : ''}" data-accion="sel" data-g="pago" data-v="${k}" aria-pressed="${m === k}"><span class="ico-circ ${col}" style="width:44px;height:44px">${ic(i)}</span><span class="op-txt"><b>${t}</b><small>${s}</small></span><span class="radio"></span></button>`).join('')}
    <button class="btn" data-accion="confirmar-entrega">${v.m ? 'Terminar carrera' : 'Confirmar entrega'}</button>
    <button class="btn-texto" data-accion="cerrar-sheet">Volver</button>`);
};
SHEETS.donde = () => {
  const c = C();
  return hoja(`<span class="agarre"></span>
    <div><h2 id="t-sheet">¿Dónde estás?</h2><p class="sub">Te mostramos los puntos según tu ubicación.</p></div>
    <label class="buscador">${ic('search', 20, 2.2)}<span class="sr-only">Buscar punto por nombre</span><input id="q-punto" type="search" placeholder="Buscar punto por nombre" autocomplete="off"></label>
    <div id="lista-puntos" class="lista-puntos">${listaPuntos('')}</div>
    <p class="nota-p">${ic('info', 16)}<span>Solo puedes entrar a puntos a menos de ${DISTANCIA_MAX} m.</span></p>
    <button class="opcion ${c.punto ? '' : 'sel'}" data-accion="sin-punto"><span class="op-txt"><b style="font-size:16px">Sin punto</b><small>Solo pedidos de la central</small></span><span class="check">${ic('check', 22, 2.6)}</span></button>`);
};
function listaPuntos(q) {
  const c = C(), n = norm(q.trim());
  const ord = [...PUNTOS].sort((a, b) => a.m - b.m);
  const enFila = p => { const k = otrosEnFila(p.id); return k ? `${k} en la fila` : 'nadie en la fila'; };
  const accion = p => c.punto === p.id ? `<span class="badge verde">${ic('check', 12, 3)}Estás aquí</span>`
    : p.m <= DISTANCIA_MAX ? `<button class="mini-btn" data-accion="elegir-punto" data-id="${p.id}">Entrar</button>`
    : `<span class="lejos">Muy lejos</span>`;
  const fila = p => `<div class="punto-fila"><span class="parada-txt" style="flex:1"><b class="${p.m <= DISTANCIA_MAX ? '' : 'apagado'}">${resaltar(p.nombre, n)}</b><small>A ${fmtDist(p.m)} · ${enFila(p)}</small></span>${accion(p)}</div>`;
  if (n) {
    const r = ord.filter(p => norm(p.nombre).includes(n));
    if (!r.length) return `<div class="aviso amarillo">${ic('info')}<span>No encontramos ese punto. Pídele a la central que lo registre.</span></div>`;
    return `<span class="etq-mini">${ic('pin', 16, 2.2)} ${r.length} resultado${r.length > 1 ? 's' : ''} · del más cercano al más lejano</span><div class="lista">${r.map(fila).join('')}</div>`;
  }
  const [cerca, ...resto] = ord;
  const boton = c.punto === cerca.id ? `<div class="bloqueado" style="height:50px;background:var(--verde-suave);color:var(--verde-texto)">${ic('check', 18, 2.6)} Estás en esta fila</div>`
    : cerca.m <= DISTANCIA_MAX ? `<button class="btn" style="height:54px;font-size:18px" data-accion="elegir-punto" data-id="${cerca.id}">Entrar a la fila</button>`
    : `<div class="bloqueado" style="height:50px">Acércate a menos de ${DISTANCIA_MAX} m</div>`;
  return `<span class="etq-mini">El más cercano</span>
    <div class="destacado"><div class="fila-ico" style="align-items:center"><span class="ico-circ naranja" style="width:46px;height:46px">${ic('store', 24)}</span><div class="parada-txt"><span class="nombre">${esc(cerca.nombre)}</span><span class="dir" style="font-size:14px">${esc(cerca.dir)}</span></div></div>
      <div class="chips"><span class="chip azul" style="font-size:14px;padding:6px 10px">${ic('pin', 15, 2.2)} A ${fmtDist(cerca.m)}</span><span class="chip" style="font-size:14px;padding:6px 10px;background:var(--amarillo-suave)">${enFila(cerca)}</span></div>
      ${boton}</div>
    <span class="etq-mini">Otros puntos cerca</span><div class="lista">${resto.slice(0, 3).map(fila).join('')}</div>`;
}

/* ---------- Render ---------- */
const app = document.getElementById('app');
function render() {
  if (!S.tel || !U()) { S.tel = null; S.pantalla = 'login'; S.sheet = null; }
  const pantalla = PANTALLAS[S.pantalla] ? S.pantalla : 'pedidos';
  const sheet = S.sheet && SHEETS[S.sheet] ? SHEETS[S.sheet]() : '';
  if (S.sheet && !sheet) { S.sheet = null; pararReloj(); }
  app.innerHTML = PANTALLAS[pantalla]() + sheet;
  document.body.style.overflow = S.sheet ? 'hidden' : '';
  guardar();
}

/* ---------- Acciones ---------- */
function tomarPedido(p) {
  const c = C();
  pararReloj();
  c.pedidos = c.pedidos.filter(x => x.id !== p.id);
  c.activo = { pedido: p, paso: 1, tomado: ahora(), recogido: null, novedad: '' };
  ir('tomado');
}
function entrarPunto(id) {
  const c = C(), pi = puntoInfo(id);
  if (!libreParaPedidos()) { toast('Paga la cuota para entrar a un punto'); return; }
  if (c.activo) { abrirSheet('activoAviso', { accion: 'entrar a un punto' }); return; }
  if (pi.m > DISTANCIA_MAX) { toast(`Acércate a menos de ${DISTANCIA_MAX} m para entrar`); return; }
  quitarDeFilas();
  filaDe(id).push(yo());
  c.punto = id; c.volverA = null; c.disponible = true;
  ir('pedidos');
  toast(`Entraste a la fila de ${pi.corto}. Eres ${posicion()}°.`);
}
function pasarTurno(auto) {
  const c = C(), p = S.tetoca;
  pararReloj(); S.tetoca = null; S.sheet = null;
  if (!p || !c.punto) { render(); return; }
  const f = filaDe(c.punto);
  const i = f.indexOf(yo()); if (i >= 0) f.splice(i, 1);
  const otro = f[0];
  if (otro) f.shift(); else c.pedidos.push(Object.assign({}, p, { origen: 'central', publicado: ahora() }));
  f.push(yo());
  render();
  const quien = otro ? `${nombreFila(otro)} tomó el pedido.` : 'Nadie más en la fila: el pedido pasó a la central.';
  toast(`${auto ? 'Se acabó el tiempo. ' : ''}${quien} Quedaste de último.`);
}
function registrarCancelacion(a, motivo, por) {
  const p = a.pedido;
  C().historial.unshift(Object.assign({}, p, { estado: 'cancelado', motivo, por, cobrado: 0, pago: '',
    tiempos: { publicado: p.publicado, tomado: a.tomado, recogido: a.recogido || undefined, cancelado: ahora() } }));
}

app.addEventListener('click', e => {
  const el = e.target.closest('[data-accion]');
  if (!el) return;
  const acc = el.dataset.accion;
  const c = S.tel ? C() : null;
  switch (acc) {
    case 'nada': break;
    case 'ir': ir(el.dataset.a); break;
    case 'llenar': {
      document.getElementById('tel').value = telFmt(el.dataset.tel);
      document.getElementById('clave').value = USUARIOS[el.dataset.tel].clave;
      document.getElementById('err-login').hidden = true;
      break;
    }
    case 'permisos': c.permisos = true; ir('pedidos'); toast('Permisos activados (simulado)'); break;
    case 'campana': {
      const n = c.pedidos.length;
      toast(!libreParaPedidos() ? 'Paga la cuota para recibir avisos de pedidos'
        : c.punto ? `Estás ${posicion()}° en la fila de ${puntoInfo(c.punto).corto}`
        : n ? `Hay ${n} pedido${n > 1 ? 's' : ''} disponible${n > 1 ? 's' : ''}` : 'No tienes notificaciones nuevas');
      break;
    }
    case 'switch': {
      if (!libreParaPedidos()) { toast('Paga la cuota para poder conectarte'); break; }
      if (c.activo && c.disponible) { abrirSheet('activoAviso', { accion: 'desconectarte' }); break; }
      if (c.disponible && c.punto) { abrirSheet('desconectar'); break; }
      c.disponible = !c.disponible;
      toast(c.disponible ? 'Estás conectado' : 'Te desconectaste');
      render(); break;
    }
    case 'confirmar-desconectar': quitarDeFilas(); c.disponible = false; cerrarSheet(); toast('Te desconectaste y saliste de la fila'); break;
    case 'filtro-tipo': S.filtroTipo = el.dataset.v; render(); break;
    case 'ver': ir('verpedido', { id: el.dataset.id }); break;
    case 'tomar': {
      if (!libreParaPedidos()) { toast('Paga la cuota para tomar pedidos'); break; }
      if (c.activo) { toast('Termina lo que tienes activo para tomar otro'); break; }
      const p = pedidoPorId(el.dataset.id);
      if (!p) break;
      if (p.loTomaOtro) {
        c.pedidos = c.pedidos.filter(x => x !== p);
        if (S.pantalla !== 'pedidos') ir('pedidos');
        S.aviso = `El pedido de ${V(p).a}`; render(); window.scrollTo(0, 0);
        break;
      }
      abrirSheet(c.punto ? 'central' : 'tomar', { id: p.id });
      break;
    }
    case 'confirmar-tomar': { const p = pedidoPorId(S.sheetParams.id); if (!p) { cerrarSheet(); break; } tomarPedido(p); break; }
    case 'confirmar-central': {
      const p = pedidoPorId(S.sheetParams.id); if (!p) { cerrarSheet(); break; }
      const desde = c.punto; quitarDeFilas(); c.volverA = desde;
      tomarPedido(p); toast('Saliste de la fila y tomaste el pedido de la central'); break;
    }
    case 'donde': {
      if (c.activo) { abrirSheet('activoAviso', { accion: 'cambiar de punto' }); break; }
      if (!libreParaPedidos()) { toast('Paga la cuota para entrar a un punto'); break; }
      abrirSheet('donde'); break;
    }
    case 'elegir-punto': {
      const id = el.dataset.id;
      if (c.punto === id) { cerrarSheet(); break; }
      if (c.punto) { abrirSheet('cambiar', { id }); break; }
      entrarPunto(id); break;
    }
    case 'confirmar-cambio': entrarPunto(S.sheetParams.id); break;
    case 'sin-punto': if (c.punto) abrirSheet('salir'); else cerrarSheet(); break;
    case 'salir-punto': abrirSheet('salir'); break;
    case 'confirmar-salir': quitarDeFilas(); cerrarSheet(); toast('Saliste de la fila. Ahora estás sin punto.'); break;
    case 'no-volver': c.volverA = null; render(); break;
    case 'toggle-central': c.centralEnPunto = !c.centralEnPunto; render(); break;
    case 'demo-punto': {
      if (!libreParaPedidos()) { toast('Paga la cuota para recibir pedidos'); break; }
      if (!c.punto) { toast('Primero entra a un punto desde el botón "Sin punto"'); break; }
      const pi = puntoInfo(c.punto), f = filaDe(c.punto);
      if (f[0] === yo()) {
        const base = PEDIDOS_PUNTO[S.extraPunto++ % PEDIDOS_PUNTO.length];
        S.tetoca = Object.assign({ tipo: 'domicilio', origen: 'punto', punto: pi.id, negocio: pi.nombre, dirNegocio: pi.dir, id: S.nextId++, publicado: ahora() }, base);
        abrirSheet('tetoca'); vibrar([200, 80, 200, 80, 200]);
      } else {
        const q = f.shift(); render();
        toast(`${nombreFila(q)} salió con un pedido de ${pi.corto}. Ahora eres ${posicion()}°.`);
      }
      break;
    }
    case 'aceptar-turno': {
      const p = S.tetoca; if (!p) break;
      const desde = c.punto; quitarDeFilas(); c.volverA = desde;
      S.tetoca = null; tomarPedido(p); break;
    }
    case 'pasar-turno': pasarTurno(false); break;
    case 'llamar': toast('Llamada simulada: en la app real se marca el número'); break;
    case 'recogido': {
      const a = c.activo; if (!a) break;
      a.paso = 2; a.recogido = ahora(); a.novedad = '';
      render(); window.scrollTo(0, 0); toast(V(a.pedido).m ? 'Listo, ahora ve al destino' : 'Listo, ahora llévalo al cliente'); break;
    }
    case 'entregado': abrirSheet('confirmar'); break;
    case 'cerrar-sheet': cerrarSheet(); break;
    case 'sel': {
      const g = el.dataset.g, v = el.dataset.v;
      S.sel[g] = v;
      document.querySelectorAll(`[data-g="${g}"]`).forEach(b => { const on = b.dataset.v === v; b.classList.toggle('sel', on); b.setAttribute('aria-pressed', on); });
      break;
    }
    case 'confirmar-entrega': {
      const a = c.activo; if (!a) break;
      const p = a.pedido, v = V(p);
      const pago = p.cobrar > 0 ? (S.sel.pago || 'efectivo') : 'pagado';
      c.historial.unshift(Object.assign({}, p, { estado: 'entregado', cobrado: p.cobrar, pago, tiempos: { publicado: p.publicado, tomado: a.tomado, recogido: a.recogido, entregado: ahora() } }));
      c.activo = null;
      ir('pedidos'); toast(`${v.m ? 'Carrera terminada' : 'Entrega confirmada'} · +${fmt(p.valor)}`); break;
    }
    case 'enviar-novedad': {
      const a = c.activo; if (!a) break;
      const lista = V(a.pedido).m ? NOVEDADES_MOTO : NOVEDADES;
      const nota = (document.getElementById('nota-nov').value || '').trim();
      a.novedad = (S.sel.novedad || lista[0]) + (nota ? ' — ' + nota : '');
      ir('activo'); toast('Novedad enviada a la central'); break;
    }
    case 'confirmar-cancelar': {
      const a = c.activo; if (!a) break;
      const nota = (document.getElementById('nota-can').value || '').trim();
      registrarCancelacion(a, (S.sel.cancelar || MOTIVOS_CANCELAR[0]) + (nota ? ' — ' + nota : ''), 'domiciliario');
      c.activo = null;
      ir('pedidos'); toast('Cancelado. La central verá el motivo.'); break;
    }
    case 'filtro': S.filtro = el.dataset.v; render(); break;
    case 'detalle': ir('detalle', { id: el.dataset.id }); break;
    case 'enviar-pago': {
      if (!S.foto) { document.getElementById('err-foto').hidden = false; break; }
      c.cuota = 'revision'; S.foto = null;
      ir('cuota'); toast('Comprobante enviado. Te avisaremos cuando lo aprueben.'); break;
    }
    case 'aprobar': c.cuota = 'al_dia'; c.disponible = true; render(); toast('Pago aprobado. Ya puedes tomar pedidos.'); break;
    case 'menu': {
      const v = el.dataset.v;
      toast(v === 'central' ? 'En la app real abre WhatsApp o llama a la central' : v === 'privacidad' ? 'Aquí irá la política de tratamiento de datos (Ley 1581)' : 'Disponible en la versión final');
      break;
    }
    case 'demo-nuevo': {
      const base = PEDIDOS_EXTRA[S.extra % PEDIDOS_EXTRA.length];
      S.extra++;
      c.pedidos.push(Object.assign({ origen: 'central' }, base, { id: S.nextId++, publicado: ahora() }));
      guardar(); vibrar([120, 60, 120]);
      toast(`Llegó ${base.tipo === 'mototaxi' ? 'una carrera nueva' : 'un pedido nuevo'}. Míralo en Pedidos.`); break;
    }
    case 'demo-cancelar': {
      const a = c.activo;
      if (!a) { toast('No tienes nada activo. Toma un pedido primero.'); break; }
      const motivo = V(a.pedido).m ? 'El pasajero canceló la carrera' : 'El cliente canceló el pedido';
      registrarCancelacion(a, motivo, 'central');
      const v = V(a.pedido);
      S.cancelado = { a: v.aOk, b: v.bOk, motivo, recogido: a.paso === 2, m: v.m };
      c.activo = null;
      ir('cancelado'); vibrar([200, 80, 200]);
      break;
    }
    case 'demo-vaciar': c.pedidos = []; guardar(); toast('Lista vacía. Ve a Pedidos para verla.'); break;
    case 'demo-reiniciar': {
      const tel = S.tel;
      S = estadoInicial(); S.tel = tel; C().permisos = true;
      ir('pedidos'); toast('Prueba reiniciada'); break;
    }
    case 'cerrar-sesion': {
      if (c.activo) { abrirSheet('activoAviso', { accion: 'cerrar sesión' }); break; }
      abrirSheet('cerrar'); break;
    }
    case 'salir': quitarDeFilas(); S.tel = null; ir('login'); break;
  }
});

app.addEventListener('submit', e => {
  if (e.target.id !== 'form-login') return;
  e.preventDefault();
  const tel = soloDigitos(document.getElementById('tel').value);
  const clave = document.getElementById('clave').value.trim();
  const u = USUARIOS[tel];
  if (!u || u.clave !== clave) { document.getElementById('err-login').hidden = false; return; }
  S.tel = tel;
  ir(C().permisos ? 'pedidos' : 'permisos');
});

app.addEventListener('input', e => {
  if (e.target.id === 'q-punto') document.getElementById('lista-puntos').innerHTML = listaPuntos(e.target.value);
});

app.addEventListener('change', e => {
  if (e.target.id !== 'foto' || !e.target.files || !e.target.files[0]) return;
  const lector = new FileReader();
  lector.onload = () => {
    S.foto = lector.result;
    const cont = document.getElementById('subir-contenido');
    if (cont) cont.innerHTML = contenidoSubir();
    const err = document.getElementById('err-foto'); if (err) err.hidden = true;
  };
  lector.readAsDataURL(e.target.files[0]);
});

/* Actualiza el "Hace X min" cada 30 segundos */
setInterval(() => {
  if (S.tel && S.pantalla === 'pedidos' && !S.sheet && document.visibilityState === 'visible' && !document.activeElement.matches('input,textarea')) render();
}, 30000);

history.replaceState({ p: S.pantalla, params: S.params }, '');
render();
</script>
</body>
</html>
